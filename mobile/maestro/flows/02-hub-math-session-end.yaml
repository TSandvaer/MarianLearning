# Critical path 2: a returning child.
# Splash → Hub → Math (Number Garden card) → Session End → Hub.
appId: host.exp.Exponent
name: Hub to Math to Session End
tags:
  - critical-path
---
# Any skip-Greet seed makes a returning child (sessionCount 1). The
# `cvc-words` seed only touches Word Song, so Math stays on the diagnostic
# baseline, the same step as a first launch.
- launchApp:
    stopApp: true
    arguments:
      seed: cvc-words
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil:
    visible:
      id: hub
    timeout: 120000
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: hub-card-number-garden
      NEXT: math
- runFlow: ../subflows/math-session.yaml
- assertVisible:
    id: session-end-count
    text: 1 of 3
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: session-end-cta
      NEXT: hub
- extendedWaitUntil:
    visible:
      id: hub
    timeout: 30000
