# Taps a Hub card and re-taps it once if the tap was lost.
#
#   CARD  the card's id, e.g. hub-card-word-song
#   NEXT  the id of the screen the card opens, e.g. word-song
#
# Run 38401377121 on a hosted CI runner: the driver tapped inside the Word
# Song card (`Tapping 615.0, 812.0`, card bounds [425,474][806,1151]) and
# the Hub stayed up, with no route change. Maestro can't see that the tap
# was lost: the Hub's caption fills in word by word, so the screen always
# looks "changed".
#
# So: wait up to 15 s for the next screen. If the card is still there,
# tap it once more, labelled MAESTRO-RETAP so run.sh counts it and the
# result line shows it. (Maestro prints a label before ${} substitution,
# so the label can't name the card; run.sh reads the card from the
# "Run flow when id: <card> is visible... COMPLETED" line instead.) A
# double tap is harmless: Hub's `pick` ignores every tap after the
# first. The tap is optional because a slow route can take the card away
# between the check and the tap.
appId: host.exp.Exponent
---
- tapOn:
    id: ${CARD}
- extendedWaitUntil:
    visible:
      id: ${NEXT}
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: ${CARD}
    commands:
      - tapOn:
          id: ${CARD}
          optional: true
          label: 'MAESTRO-RETAP: the card was still visible 15 s after the tap, tapping it again'
