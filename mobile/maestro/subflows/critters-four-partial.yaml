# Letter critters' four-letter rounds, F21 (F29), part 2 of 3: c, a and t
# sit on seats 0-2 of the four-seat log (the calling flow dragged them).
# Nothing sings on its own (§ 4.1, "1-3 seated"): 5 s with no line, no
# picture and no clear. A log tap sings the three (left to right, F12)
# and nothing else: no line, picture, tumble or bonus, the shelf stays
# and no slot fills. The calling flow then builds c-a-t-s.
#
# The runs are muted, and the critters' own sounds (the tap-clip player)
# write no Metro row, so "c ... a ... t" itself is F12's (jest, fake
# timers). Emma's lines and the sound effects do write `[audio] onPlay`
# rows to Metro's log, so "no line" can also be read there.
#
#   SHOT  the screenshots' prefix
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      id: critter-seat-2
      text: Letter t, on the log
    timeout: 5000
- assertVisible:
    id: critter-seat-0
    text: Letter c, on the log
- assertVisible:
    id: critter-seat-1
    text: Letter a, on the log
- assertNotVisible:
    id: critter-seat-3
# 5 s from the last drop: nothing comes up (the wait is meant to run out).
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 5000
    optional: true
- assertNotVisible:
    id: play-game-ribbon
- assertNotVisible:
    id: critter-picture
- assertVisible:
    id: critter-seat-2
    text: Letter p, on the log
- assertVisible:
    id: critter-seat-0
- takeScreenshot: ${SHOT}-three-seated
# The log tap (the numeral disc is part of the log, with no touch of its
# own): the three sing, about 2 s; then still nothing else.
- tapOn:
    id: critter-log-numeral
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 5000
    optional: true
- assertNotVisible:
    id: play-game-ribbon
- assertNotVisible:
    id: critter-picture
- assertNotVisible:
    id: critter-tumble
- assertNotVisible:
    id: hunt-bonus
- assertVisible:
    id: critter-seat-0
    text: Letter c, on the log
- assertVisible:
    id: critter-seat-1
    text: Letter a, on the log
- assertVisible:
    id: critter-seat-2
    text: Letter p, on the log
- assertVisible:
    id: hunt-slot-2
    text: Word to find
- assertVisible:
    id: hunt-slot-3
    text: Word to find
- takeScreenshot: ${SHOT}-after-log-tap
