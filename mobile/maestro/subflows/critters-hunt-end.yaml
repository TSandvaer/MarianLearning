# Letter critters' word hunt, part 3 of 3: after b-a-t, the last slot
# (1) fills with no second beat; New letters deals a fresh board; Back →
# the picker; Back → the Play place.
#
#   SHOT  the screenshots' prefix
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      id: hunt-slot-1
      text: Bat
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- assertNotVisible:
    id: hunt-slot-0-lap
- assertVisible:
    id: hunt-new-letters
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-board-full

# New letters: a fresh board, every slot empty.
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: hunt-new-letters
      NEXT: critter-log-numeral
- extendedWaitUntil:
    notVisible:
      id: hunt-new-letters
    timeout: 10000
- assertNotVisible:
    id: hunt-slot-0-tile-0
- assertVisible:
    id: critter-log-numeral
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-new-letters
# t-a-g opened "4" (the seed has only "3" open), so Back goes to the
# picker first (critters-four-letter.md § 5.1); Back stays on screen over
# it: the -stays variant. Then Back → the Play place.
- runFlow:
    file: tap-and-confirm-stays.yaml
    env:
      TARGET: play-game-back
      NEXT: hunt-picker
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: play-game-back
      NEXT: play-place
