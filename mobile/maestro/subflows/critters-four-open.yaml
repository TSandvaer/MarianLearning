# Letter critters' four-letter rounds, F20 (`design/native/critters-four-letter.md`
# § 10.3), part 1 of 2: from the Hub to the `critters-hunt` seed's
# three-letter round in progress (a b g h p t; bag, hat, bat and tap
# found) for a learner with only "3" open: no picker, the round at once
# (§ 5.1). The calling flow (14, per form) then drags t-a-g, and
# `critters-four-roll-in.yaml` takes it from the beat.
#
# The filled slots are checked by their labels (the word, "Bat"), not by
# their tile ids: a slot is one accessibility element (a `Pressable` with
# a label), so iOS does not list the ids inside it reliably, and
# `critters-hunt-open.yaml:36`'s `hunt-slot-4-tile-0` is missing from the
# tree while the tiles are on screen (the PR #710 QA run, on main too).
#
#   SHOT  the screenshots' prefix
appId: host.exp.Exponent
---
- runFlow: open-app.yaml
- extendedWaitUntil:
    visible:
      id: hub-play
    timeout: 120000
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: hub-play
      NEXT: play-place
- extendedWaitUntil:
    visible:
      id: play-tile-critters
    timeout: 15000
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: play-tile-critters
      NEXT: letter-critters
- assertNotVisible:
    id: hunt-picker
# The round in progress, in board order bag, bat, hat, tag, tap, pat: the
# "3" log, four slots filled, tag (pictured) and pat (the listen mark)
# empty.
- extendedWaitUntil:
    visible:
      id: critter-log
      text: Log, three letters
    timeout: 15000
- assertVisible:
    id: hunt-slot-0
    text: Bag
- assertVisible:
    id: hunt-slot-1
    text: Bat
- assertVisible:
    id: hunt-slot-2
    text: Hat
- assertVisible:
    id: hunt-slot-3
    text: Word to find
- assertVisible:
    id: hunt-slot-4
    text: Tap
- assertVisible:
    id: hunt-slot-5
    text: Word to find
- assertNotVisible:
    id: hunt-new-letters
- assertNotVisible:
    id: hunt-open-four
# The open line and the drag hint end (the hand loops 6 s).
- extendedWaitUntil:
    notVisible:
      id: play-game-ribbon
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-round-in-progress
