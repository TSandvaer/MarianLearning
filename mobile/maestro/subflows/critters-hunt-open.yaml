# Letter critters' word hunt (critters-word-hunt.md § 10.3, H26; § 16.4,
# B10), part 1 of 3: from the Hub to the `critters-hunt` seed's round in
# progress (a b f g h t; bag and hat found), and its screenshot. The
# calling flow (12, 13) then drags t-a-g; Maestro reads a swipe's points
# when it loads a flow, so they can't be env values here.
#
# Slots are checked by their labels (the word, or "Word to find"): the
# ids inside a slot are not listed reliably (see critters-four-open.yaml).
#
#   SHOT  the screenshots' prefix
appId: host.exp.Exponent
---
- runFlow: open-app.yaml
- extendedWaitUntil:
    visible:
      id: hub-play
    timeout: 120000
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: hub-play
      NEXT: play-place
- extendedWaitUntil:
    visible:
      id: play-tile-critters
    timeout: 15000
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: play-tile-critters
      NEXT: letter-critters
# The round in progress: the 3 on the log, the N-4 board (§ 16.2), two
# slots filled, two empty. In board order (§ 15.2) the slots hold bag,
# bat, hat, tag, every one with its picture from the deal (no listen
# mark: the screenshot).
- extendedWaitUntil:
    visible:
      id: critter-log-numeral
    timeout: 15000
- assertVisible:
    id: hunt-slot-0
    text: Bag
- assertVisible:
    id: hunt-slot-1
    text: Word to find
- assertVisible:
    id: hunt-slot-2
    text: Hat
- assertVisible:
    id: hunt-slot-3
    text: Word to find
- assertNotVisible:
    id: hunt-slot-4
- assertNotVisible:
    id: hunt-new-letters
# The open line and the drag hint end (the hand loops 6 s).
- extendedWaitUntil:
    notVisible:
      id: play-game-ribbon
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-round-in-progress
