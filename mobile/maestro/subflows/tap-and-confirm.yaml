# Taps an element and taps it once more if the tap was lost.
#
#   TARGET  the id to tap, e.g. hub-card-word-song
#   NEXT    the id of what the tap opens, e.g. word-song
#
# Every tap in the flows goes through here (system dialogs: open-app.yaml).
# The hosted CI simulator sometimes drops a tap that Maestro reports as
# done:
# - run 38401377121: `Tapping 615.0, 812.0`, inside hub-card-word-song
#   ([425,474][806,1151]), and the Hub stayed up;
# - run 38405534142 attempt 2: `Tapping 491.0, 615.0` on the "Open in
#   “Expo Go”?" dialog's Open button ([421,591][561,639]), twice, and the
#   dialog stayed up.
# Maestro can't tell, because an animated screen always looks "changed".
#
# So: wait up to 15 s for NEXT. If TARGET is still there, tap it once
# more, labelled MAESTRO-RETAP so run.sh counts it and the result line
# names it. (Maestro prints a label before ${} substitution, so run.sh
# reads the id from the "Run flow when id: <TARGET> is visible...
# COMPLETED" line.) A second tap is harmless: every target ignores taps
# after the first (Hub `pick`, Greet's heart, Session End and the map's
# `leave`). The re-tap is optional because a slow route can take TARGET
# away between the check and the tap.
appId: host.exp.Exponent
---
- tapOn:
    id: ${TARGET}
- extendedWaitUntil:
    visible:
      id: ${NEXT}
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: ${TARGET}
    commands:
      - tapOn:
          id: ${TARGET}
          optional: true
          label: 'MAESTRO-RETAP: still visible 15 s after the tap, tapping it again'
