# Letter critters' four-letter rounds, F21 (`design/native/critters-four-letter.md`
# § 10.3), part 1 of 3: from the Hub to the `critters-hunt-four` seed's
# four-letter round in progress (a b c d l m p; clap and lamp found; "3"
# and "4" open). The game opens on the picker; "4" opens the round. In
# board order (F5) the slots hold clap, lamp (pictured), camp, damp (the
# listen marks). The calling flow (15, per form) then seats c, a, p.
#
# Slots are checked by their labels (the word, or "Word to find"): the
# ids inside a slot are not listed reliably (see critters-four-open.yaml).
#
#   SHOT  the screenshots' prefix
appId: host.exp.Exponent
---
- runFlow: open-app.yaml
- extendedWaitUntil:
    visible:
      id: hub-play
    timeout: 120000
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: hub-play
      NEXT: play-place
- extendedWaitUntil:
    visible:
      id: play-tile-critters
    timeout: 15000
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: play-tile-critters
      NEXT: hunt-picker
- assertVisible:
    id: hunt-pick-3
    text: Log, three letters
- assertVisible:
    id: hunt-pick-4
    text: Log, four letters
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: hunt-pick-4
      NEXT: letter-critters
- extendedWaitUntil:
    visible:
      id: critter-log
      text: Log, four letters
    timeout: 15000
- assertVisible:
    id: hunt-slot-0
    text: Clap
- assertVisible:
    id: hunt-slot-1
    text: Lamp
- assertVisible:
    id: hunt-slot-2
    text: Word to find
- assertVisible:
    id: hunt-slot-3
    text: Word to find
- assertNotVisible:
    id: hunt-slot-4
- assertNotVisible:
    id: hunt-new-letters
# The four-letter open line and the drag hint end (the hand loops 6 s).
- extendedWaitUntil:
    notVisible:
      id: play-game-ribbon
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-round-in-progress
