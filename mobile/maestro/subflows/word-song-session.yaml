# One Word Song session, from Word Song's mount to Session End's "All
# done" button. The QA autotap answers (problem 1: three wrong, then the
# answer; problem 3: one wrong, not problem 2, a cat-words check probe; the
# rest right), so the session is 7 of 8: a good day.
# With the API unreachable, Word Song plays the step's canon session, built
# on the device (`src/session/localSession.ts`); a session with a planner
# hint fails over to one of core's static plans with silent captions.
# The waits are the sweep's (sweep/step.yaml): Maestro 2.11.0 counts an
# extendedWaitUntil timeout from the last interaction (the card tap), and
# with the canon plan's audio Session End's lines still play when it shows.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      id: word-song
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: word-song-chips
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: session-end
    timeout: 300000
- extendedWaitUntil:
    visible:
      id: session-end-cta
    timeout: 420000
