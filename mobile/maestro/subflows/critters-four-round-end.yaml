# Letter critters' four-letter rounds, F21 (F29), part 3 of 3: the calling
# flow has built c-a-t-s (s onto seat 3). Four seated sing; cats is a
# target: Emma's word line, the joy beat and its picture, then its tiles
# fill its own slot, the third (board index 2), and that is 3 of 4, so
# the beat plays (the lap, "You did it!") and New letters enters, with no
# roll-in ("4" is already open). Sand's slot stays empty (findable). New
# letters: a fresh four-letter board. Back → the picker; Back → the Play
# place.
#
#   SHOT  the screenshots' prefix
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      id: critter-seat-3
      text: Letter s, on the log
    timeout: 5000
- assertVisible:
    id: critter-seat-2
    text: Letter t, on the log
# The fill: cats' slot.
- extendedWaitUntil:
    visible:
      id: hunt-slot-2
      text: Cats
    timeout: 20000
# The beat: the lap lights each found slot in turn, then "You did it!".
- extendedWaitUntil:
    visible:
      id: hunt-slot-[0-2]-lap
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 20000
- takeScreenshot: ${SHOT}-beat-you-did-it
- extendedWaitUntil:
    visible:
      id: hunt-new-letters
    timeout: 20000
- assertNotVisible:
    id: hunt-roll-in
- assertNotVisible:
    id: hunt-open-four
# Sand stays findable; the found three keep their words.
- assertVisible:
    id: hunt-slot-3
    text: Word to find
- assertVisible:
    id: hunt-slot-0
    text: Ants
- assertVisible:
    id: hunt-slot-1
    text: Bats
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-board-after-beat

# New letters: a fresh four-letter board. Its id stays on screen for the
# deal's fade, so a lost tap is read from it still being up after 15 s
# (as the door's in critters-four-roll-in.yaml).
- tapOn:
    id: hunt-new-letters
- extendedWaitUntil:
    notVisible:
      id: hunt-new-letters
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: hunt-new-letters
    commands:
      - tapOn:
          id: hunt-new-letters
          optional: true
          label: 'MAESTRO-RETAP: still visible 15 s after the tap, tapping it again'
- extendedWaitUntil:
    visible:
      id: hunt-slot-0
      text: Word to find
    timeout: 10000
- assertVisible:
    id: critter-log
    text: Log, four letters
- assertVisible:
    id: hunt-slot-1
    text: Word to find
- assertVisible:
    id: hunt-slot-2
    text: Word to find
- assertVisible:
    id: hunt-slot-3
    text: Word to find
- assertNotVisible:
    text: Ants|Bats|Cats
- assertVisible:
    id: critter-[a-z]
    index: 6
- assertNotVisible:
    id: critter-[a-z]
    index: 7
- assertNotVisible:
    id: hunt-new-letters
- assertNotVisible:
    id: hunt-bonus
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-new-letters
# Back stays on screen over the picker: the -stays variant (see
# critters-four-roll-in.yaml).
- runFlow:
    file: tap-and-confirm-stays.yaml
    env:
      TARGET: play-game-back
      NEXT: hunt-picker
- runFlow:
    file: tap-and-confirm.yaml
    env:
      TARGET: play-game-back
      NEXT: play-place
