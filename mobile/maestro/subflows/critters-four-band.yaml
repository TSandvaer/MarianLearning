# Letter critters' four-letter rounds (critters-four-letter.md § 15.3;
# § 15.5, F29): the calling flow has built b-a-n-d on the
# `critters-hunt-four` seed's round (ants bats cats sand; band its extra).
# Emma says "Band." (her ribbon) and the joy beat plays; nothing fills and
# no chip appears in a four-letter round; the shelf clears. The calling
# flow then seats c, a, t.
#
#   SHOT  the screenshots' prefix
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      id: critter-seat-3
      text: Letter d, on the log
    timeout: 5000
- assertVisible:
    id: critter-seat-0
    text: Letter b, on the log
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 10000
- takeScreenshot: ${SHOT}-band-said
- assertNotVisible:
    id: critter-picture
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- assertNotVisible:
    id: hunt-bonus
- assertVisible:
    id: hunt-slot-0
    text: Ants
- assertVisible:
    id: hunt-slot-1
    text: Bats
- assertVisible:
    id: hunt-slot-2
    text: Word to find
- assertVisible:
    id: hunt-slot-3
    text: Word to find
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}-after-band
