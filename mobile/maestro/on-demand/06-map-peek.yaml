# Map peek: a locked later stop asks first, the green button starts the peek.
#
# `cvc-words` seed: Word Song on CVC words, the short-o to short-e stops of
# the same land still locked. A tap on a stop after the current step that is
# not mastered is a peek (core `isPeekableStop`, `packages/core/src/map/peek.ts`);
# it opens the peek prompt (#657): the stop's name, then the question and
# the round button `map-peek-button` (`useMapVisit.ts` `openPrompt`).
#
# The button starts the peek: `requestPeek` builds the step's 3 problems on
# the device from the bundled canon (no-Claude plan phase 2,
# `src/session/localSession.ts`), so it plays with the harness's closed API
# port: Word Song shows the step's problem 1, the QA autotap answers the
# three, and the peek's end goes back to the map.
appId: host.exp.Exponent
name: Map peek
tags:
  - map
---
- launchApp:
    stopApp: true
    arguments:
      seed: cvc-words
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil:
    visible:
      id: hub
    timeout: 120000
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: hub-map-word-song
      NEXT: map
- extendedWaitUntil:
    visible:
      id: map-stop-cvc-words-short-u
    timeout: 15000
# The stop stays on screen after its tap: tap-and-confirm-stays.yaml.
- runFlow:
    file: ../subflows/tap-and-confirm-stays.yaml
    env:
      TARGET: map-stop-cvc-words-short-u
      NEXT: map-peek-button
- extendedWaitUntil:
    visible:
      id: map-peek-button
    timeout: 30000
- takeScreenshot: map-peek-button
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: map-peek-button
      NEXT: word-song
- extendedWaitUntil:
    visible:
      id: word-song-chips
    timeout: 30000
- takeScreenshot: map-peek-problem
- extendedWaitUntil:
    visible:
      id: map-stop-cvc-words-short-u
    timeout: 180000
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: map-home
      NEXT: hub
- extendedWaitUntil:
    visible:
      id: hub
    timeout: 30000
