# D25 of `design/native/critters-digraph.md` § 11.3, on an iPad in portrait:
# the `critters-hunt-ch-four` seed (digraphs-ch current, "3" and "4" open;
# Dave's ch-e fallback e ch c j n s t with jets and nest found, D23) → the
# picker → "4" → the round in progress: the ch critter in cell 2, no h → ch,
# e, s seated (still, 1-3 seated) → t: chest's four-box slot (0) fills with
# [ch][e][s][t], the beat (3 of 4), tent stays findable, no chip → Back →
# Back. The shared steps are
# `../subflows/critters-digraph-ch-four-{open,partial,end}.yaml`.
#
# The points are for the iPad Pro 11-inch (M5) simulator in portrait (834 x
# 1210, insets t32 b20), as 15-critters-four-round.yaml: the meadow is 4 +
# 3, rows at y 983 (x 261, 365, 469, 573) and 1087 (x 313, 417, 521); the
# seats at y 853, x 228, 354, 480 and 606. The digraph round's layout is a
# plain round's (D22).
#
#   e ch c j  /  n s t
#
# Screenshots go to Maestro's output (run.sh `--debug-output`, under
# MAESTRO_OUT/24-critters-digraph-ch-four/).
appId: host.exp.Exponent
name: Critters digraph ch, four seats (iPad portrait)
tags:
  - play
---
- launchApp:
    stopApp: true
    arguments:
      seed: critters-hunt-ch-four
# A flow that failed in landscape leaves the simulator there.
- setOrientation: PORTRAIT
- runFlow:
    file: ../subflows/critters-digraph-ch-four-open.yaml
    env:
      SHOT: digraph-ch-four-ipad-portrait
# ch, e, s onto seats 0-2.
- swipe:
    start: 365, 983
    end: 228, 853
    duration: 800
- swipe:
    start: 261, 983
    end: 354, 853
    duration: 800
- swipe:
    start: 417, 1087
    end: 480, 853
    duration: 800
    waitToSettleTimeoutMs: 300
- runFlow:
    file: ../subflows/critters-digraph-ch-four-partial.yaml
    env:
      SHOT: digraph-ch-four-ipad-portrait
# ch-e-s-t: t onto seat 3.
- swipe:
    start: 521, 1087
    end: 606, 853
    duration: 800
    waitToSettleTimeoutMs: 300
- runFlow:
    file: ../subflows/critters-digraph-ch-four-end.yaml
    env:
      SHOT: digraph-ch-four-ipad-portrait
