# Letter critters' word hunt, one round to completion, on an iPad in
# landscape (`design/native/critters-word-hunt.md` § 10.3, H26; the shared
# steps are `../subflows/critters-hunt-{open,beat,end}.yaml`).
#
# The `critters-hunt` seed (critters-word-hunt.md § 16.4): a learner past
# cvc-words with short o current (Marian, 2026-10-25) and the round a b f
# g h t in progress, bag and hat found (N 4: bag bat hat tag). The meadow
# is 3 a row in 2 rows, in round order:
#
#   a b f  /  g h t
#
# The points are for the iPad Pro 11-inch (M5) simulator in landscape
# (the README's device; 1210 x 834, insets t32 b20 in Expo Go 58, whose
# status bar shows; see 07-letter-critters.yaml), from `huntScene`: slots
# at S1, the meadow's rows at y 542 and 646, cells at x 373, 477 and 581;
# the seats at y 411, x 351, 477 and 603. The meadow and seats do not
# move with N (checked at N 4 and 6). (Expo Go 57: t0, every y 16 less.)
#
# Screenshots go to Maestro's output (run.sh `--debug-output`, under
# MAESTRO_OUT/12-critters-word-hunt/).
appId: host.exp.Exponent
name: Critters word hunt (iPad landscape)
tags:
  - play
---
- launchApp:
    stopApp: true
    arguments:
      seed: critters-hunt
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    file: ../subflows/critters-hunt-open.yaml
    env:
      SHOT: hunt-tablet-landscape
# t-a-g, the completing find. The vowel has no twin: its burrow is ringed.
- swipe:
    start: 581, 646
    end: 351, 411
    duration: 800
- swipe:
    start: 373, 542
    end: 477, 411
    duration: 800
- assertVisible:
    id: critter-burrow-empty-a
- swipe:
    start: 373, 646
    end: 603, 411
    duration: 800
    waitToSettleTimeoutMs: 300
- runFlow:
    file: ../subflows/critters-hunt-beat.yaml
    env:
      SHOT: hunt-tablet-landscape
# b-a-t, the last slot, after the beat.
- swipe:
    start: 477, 542
    end: 351, 411
    duration: 800
- swipe:
    start: 373, 542
    end: 477, 411
    duration: 800
- swipe:
    start: 581, 646
    end: 603, 411
    duration: 800
    waitToSettleTimeoutMs: 300
- runFlow:
    file: ../subflows/critters-hunt-end.yaml
    env:
      SHOT: hunt-tablet-landscape
- setOrientation: PORTRAIT
