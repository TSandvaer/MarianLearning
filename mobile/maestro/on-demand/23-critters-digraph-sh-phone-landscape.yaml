# D24 of `design/native/critters-digraph.md` § 11.3, on a phone in
# landscape: the `critters-hunt-sh` seed (every CVC step mastered,
# digraphs-sh current; Dave's sh-i fallback i sh b c n p with bin and pin
# found, D23) → the round in progress: the sh critter in cell 2, no s and no
# h → two taps on it: the first says "Two letters, one sound!" after its
# sound (Dave's Q38 ruling, D28), the second plays the sound only → sh-i-n:
# an extra, the chip's [sh][i][n] → sh-i-p: ship's slot (3) fills with
# [sh][i][p], the beat (3 of 4), bib stays findable → the roll-in → Back →
# Back. The shared steps are
# `../subflows/critters-digraph-sh-{open,taps,shin,ship}.yaml`.
#
# The points are for an iPhone 17 simulator in landscape (874 x 402, insets
# t0 b20 l62 r62), as 14-critters-four-door-phone-landscape.yaml: the
# meadow's rows at y 272 and 328, cells at x 331, 387 and 443; the seats at
# y 194, x 318, 386 and 454. The meadow critter is c 48 here, the smallest
# (D26). The digraph round's layout is a plain round's (D22).
#
#   i sh b  /  c n p
#
# Screenshots go to Maestro's output (run.sh `--debug-output`, under
# MAESTRO_OUT/23-critters-digraph-sh-phone-landscape/); Thomas's eye (D27)
# reads the critter, its seated size, the slot and the chip from them.
appId: host.exp.Exponent
name: Critters digraph sh (phone landscape)
tags:
  - play
---
- launchApp:
    stopApp: true
    arguments:
      seed: critters-hunt-sh
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    file: ../subflows/critters-digraph-sh-open.yaml
    env:
      SHOT: digraph-sh-phone-landscape
- runFlow:
    file: ../subflows/critters-digraph-sh-taps.yaml
    env:
      SHOT: digraph-sh-phone-landscape
# sh-i-n: an extra, the chip appears.
- swipe:
    start: 387, 272
    end: 318, 194
    duration: 800
- swipe:
    start: 331, 272
    end: 386, 194
    duration: 800
- swipe:
    start: 387, 328
    end: 454, 194
    duration: 800
    waitToSettleTimeoutMs: 300
- runFlow:
    file: ../subflows/critters-digraph-sh-shin.yaml
    env:
      SHOT: digraph-sh-phone-landscape
# sh-i-p: ship, the completing find (3 of 4).
- swipe:
    start: 387, 272
    end: 318, 194
    duration: 800
- swipe:
    start: 331, 272
    end: 386, 194
    duration: 800
- swipe:
    start: 443, 328
    end: 454, 194
    duration: 800
    waitToSettleTimeoutMs: 300
- runFlow:
    file: ../subflows/critters-digraph-sh-ship.yaml
    env:
      SHOT: digraph-sh-phone-landscape
- setOrientation: PORTRAIT
