# Letter critters after Marian's play test (Thomas 2026-10-23, play-place
# § 3.3): the drag hint on entry, a run of three on the log, the caption
# gone after Emma's line, and the shelf cleared after the run.
#
# A CVC-words learner (`qaStep: add-to-10` + the `cvc-words` seed, as 05's
# second learner): past blending sounds, so a non-word boings and gets a
# line. The visit's letters are random, but the meadow always starts with
# the five vowels (core `critterSet`, vowels first), so dragging the first
# three critters (a, e, i) builds "aei", a non-word, on every visit.
#
# Drags are swipes between points: Maestro can't VoiceOver-activate. The
# points are for the iPad Pro 11-inch (M5) simulator in portrait (the
# README's device), from `critterScene` there (c 88, g 16, 7 critters a
# row, 16 critters): the meadow's first row is at y 760, x 105 + 104 k for
# cell k; the log's seats are at y 629, x 291, 417 and 543.
#
# Then a picture word, when the visit's letters allow one at a known spot
# (consonants come alphabetically after the vowels, so their cells vary):
# with a "b" critter, b is cell 5 and "bib" (cells 5, 2, 5: the burrow's
# twin lets a letter sit twice); without b, "dad" with d at cell 5 (no c)
# or 6 (with c). A visit with none of these skips the picture.
#
# Screenshots go to Maestro's output (run.sh `--debug-output`, under
# MAESTRO_OUT/07-letter-critters/).
appId: host.exp.Exponent
name: Letter critters
tags:
  - play
---
- launchApp:
    stopApp: true
    arguments:
      qaStep: add-to-10
      seed: cvc-words
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil:
    visible:
      id: hub-play
    timeout: 120000
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: hub-play
      NEXT: play-place
- extendedWaitUntil:
    visible:
      id: play-tile-critters
    timeout: 15000
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: play-tile-critters
      NEXT: letter-critters
- extendedWaitUntil:
    visible:
      id: letter-critters
    timeout: 15000
# The hand and the open line start together, 500 ms after the game; the
# hand loops for 6 s. If the taps above took longer, both come back 8 s
# after it (the first idle return), so the ribbon is the cue either way.
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 25000
# About 1 s in: the hand is pressed and gliding up (the screen never
# settles while it loops, so this waits the whole timeout).
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: critters-hint-on-entry

# A run of three: a, e, i (cells 0, 1, 2) onto the three seats.
- swipe:
    start: 105, 760
    end: 291, 629
    duration: 800
- swipe:
    start: 209, 760
    end: 417, 629
    duration: 800
- swipe:
    start: 313, 760
    end: 543, 629
    duration: 800
- extendedWaitUntil:
    visible:
      id: critter-seat-2
    timeout: 5000
- assertVisible:
    id: critter-seat-0
# "aei" is no word: the sounds, the boing and tumble, Emma's line.
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 15000
- takeScreenshot: critters-nonword-line
# The line ends: its caption goes; then the shelf drops home.
- extendedWaitUntil:
    notVisible:
      id: play-game-ribbon
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- assertNotVisible:
    id: play-game-ribbon
- assertNotVisible:
    id: critter-seat-1
- assertNotVisible:
    id: critter-seat-2
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: critters-shelf-clear-after-nonword

# A picture word, where the letters allow one (see the header). Exactly
# one case runs: the letters it checks are still there afterwards.
# "bib": b is cell 5.
- runFlow:
    when:
      visible:
        id: critter-b
    commands:
      - swipe:
          start: 625, 760
          end: 291, 629
          duration: 800
      - swipe:
          start: 313, 760
          end: 417, 629
          duration: 800
      - swipe:
          start: 625, 760
          end: 543, 629
          duration: 800
      - extendedWaitUntil:
          visible:
            id: critter-picture
          timeout: 15000
      - takeScreenshot: critters-picture-on-top
# No b: "dad", d at cell 6 after a c, else at cell 5; no d, no picture.
- runFlow:
    when:
      notVisible:
        id: critter-b
    commands:
      - runFlow:
          when:
            visible:
              id: critter-c
          commands:
            - runFlow:
                when:
                  visible:
                    id: critter-d
                commands:
                  - swipe:
                      start: 729, 760
                      end: 291, 629
                      duration: 800
                  - swipe:
                      start: 105, 760
                      end: 417, 629
                      duration: 800
                  - swipe:
                      start: 729, 760
                      end: 543, 629
                      duration: 800
                  - extendedWaitUntil:
                      visible:
                        id: critter-picture
                      timeout: 15000
                  - takeScreenshot: critters-picture-on-top
      - runFlow:
          when:
            notVisible:
              id: critter-c
          commands:
            - runFlow:
                when:
                  visible:
                    id: critter-d
                commands:
                  - swipe:
                      start: 625, 760
                      end: 291, 629
                      duration: 800
                  - swipe:
                      start: 105, 760
                      end: 417, 629
                      duration: 800
                  - swipe:
                      start: 625, 760
                      end: 543, 629
                      duration: 800
                  - extendedWaitUntil:
                      visible:
                        id: critter-picture
                      timeout: 15000
                  - takeScreenshot: critters-picture-on-top
# The picture leaves and the shelf drops home (at once when no case ran).
- extendedWaitUntil:
    notVisible:
      id: critter-picture
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: critters-shelf-clear-after-picture
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: play-game-back
      NEXT: play-place
