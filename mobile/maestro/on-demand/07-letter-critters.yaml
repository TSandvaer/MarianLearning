# Letter critters after Marian's play test (Thomas 2026-10-23, play-place
# § 3.3): the drag hint on entry, a run of three on the log, the caption
# gone after Emma's line, and the shelf cleared after the run. After build
# 20 (Thomas 2026-10-23): every letter on a tablet where all 22 fit both
# ways, and a said word with a pack picture ("rat") pops it after Emma
# says it. The probe reserve (Thomas 2026-10-24): "ham", one of its new
# pack pictures, pops by the same rule. After build 21 (Thomas 2026-10-25:
# "mom" tumbled; Dave's ruling): "mom" and "egg" are said and pop their
# picture.
#
# The free meadow, so a learner before blending sounds (`qaStep: add-to-10`
# + the `letter-sounds` seed): from blending sounds the meadow is the word
# hunt (critters-word-hunt.md § 8; flows 12 and 13), and before it a
# non-word sings and sits, quietly, with no line (Dave's safeguard). Until
# the word hunt (2026-10-25) this flow used a CVC-words learner, whose
# non-word boinged with a line.
#
# Drags are swipes between points: Maestro can't VoiceOver-activate. The
# points are for the iPad Pro 11-inch (M5) simulator in portrait (the
# README's device; 834 x 1210, insets t32 b20 in Expo Go 58, whose status
# bar shows: SDK 58's scene life cycle ignores `<StatusBar hidden />`, and
# only a native build hides it, through app.json), from `critterScene`
# there with all 22 critters (c 88, g 16, 7 a row, 4 rows), which this
# screen shows on every visit (`crittersFitBothWays`): the meadow is the
# vowels, then the consonants alphabetically, so every cell is fixed. Rows
# at y 723, 827, 931 and 1035, cell k of a row at x 105 + 104 k (the last
# row, x alone, at 417); the log's seats at y 592, x 291, 417 and 543.
# (Expo Go 57 hid the bar: t0, and every y here was 16 less.)
#
#   a e i o u b c  /  d f g h j l m  /  n p r s t v w  /  x
#
# Screenshots go to Maestro's output (run.sh `--debug-output`, under
# MAESTRO_OUT/07-letter-critters/).
appId: host.exp.Exponent
name: Letter critters
tags:
  - play
---
- launchApp:
    stopApp: true
    arguments:
      qaStep: add-to-10
      seed: letter-sounds
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil:
    visible:
      id: hub-play
    timeout: 120000
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: hub-play
      NEXT: play-place
- extendedWaitUntil:
    visible:
      id: play-tile-critters
    timeout: 15000
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: play-tile-critters
      NEXT: letter-critters
- extendedWaitUntil:
    visible:
      id: letter-critters
    timeout: 15000
# The hand and the open line start together, 500 ms after the game; the
# hand loops for 6 s. If the taps above took longer, both come back 8 s
# after it (the first idle return), so the ribbon is the cue either way.
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 25000
# About 1 s in: the hand is pressed and gliding up (the screen never
# settles while it loops, so this waits the whole timeout).
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: critters-hint-on-entry

# Every letter is on the meadow (Thomas: "there is no 'm' letter").
- assertVisible:
    id: critter-m
- assertVisible:
    id: critter-r
- assertVisible:
    id: critter-x
- assertVisible:
    id: critter-w
- assertVisible:
    id: critter-j
- assertVisible:
    id: critter-b
- assertVisible:
    id: critter-c
- assertVisible:
    id: critter-d
- assertVisible:
    id: critter-l
- assertVisible:
    id: critter-s

# A run of three: a, e, i (row 1, cells 0, 1, 2) onto the three seats.
- swipe:
    start: 105, 723
    end: 291, 592
    duration: 800
- swipe:
    start: 209, 723
    end: 417, 592
    duration: 800
- swipe:
    start: 313, 723
    end: 543, 592
    duration: 800
- extendedWaitUntil:
    visible:
      id: critter-seat-2
    timeout: 5000
- assertVisible:
    id: critter-seat-0
# "aei" is no word: before blending sounds it sings and sits, quietly;
# then the shelf drops home.
- takeScreenshot: critters-nonword-quiet
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- assertNotVisible:
    id: play-game-ribbon
- assertNotVisible:
    id: critter-seat-1
- assertNotVisible:
    id: critter-seat-2
- waitForAnimationToEnd:
    timeout: 1500
# The whole meadow, hint gone: all 22 letters.
- takeScreenshot: critters-meadow-22-portrait

# A picture word: "bib" (b is row 1 cell 5, i cell 2; the burrow's twin
# lets a letter sit twice).
- swipe:
    start: 625, 723
    end: 291, 592
    duration: 800
- swipe:
    start: 313, 723
    end: 417, 592
    duration: 800
- swipe:
    start: 625, 723
    end: 543, 592
    duration: 800
- extendedWaitUntil:
    visible:
      id: critter-picture
    timeout: 15000
- takeScreenshot: critters-picture-on-top
# The picture leaves and the shelf drops home.
- extendedWaitUntil:
    notVisible:
      id: critter-picture
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: critters-shelf-clear-after-picture

# A said word with a pack picture: "rat" (r row 3 cell 2, a row 1 cell 0,
# t row 3 cell 4). The sounds, then Emma says "Rat." (her line, too short
# to catch here; Metro's log shows `play:guide.play.critters.word.rat`),
# then the rat picture (2.9 s up), then the shelf clears. The last swipe
# barely waits to settle: Emma's breathing keeps the screen from settling,
# and the default wait (8-12 s) outlasts the whole run.
- swipe:
    start: 313, 931
    end: 291, 592
    duration: 800
- swipe:
    start: 105, 723
    end: 417, 592
    duration: 800
- swipe:
    start: 521, 931
    end: 543, 592
    duration: 800
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: critter-picture
    timeout: 15000
- takeScreenshot: critters-rat-picture
- extendedWaitUntil:
    notVisible:
      id: critter-picture
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: critters-shelf-clear-after-rat

# A probe-reserve word with its new pack picture: "ham" (h row 2 cell 3,
# a row 1 cell 0, m row 2 cell 6). The sounds, Emma says "Ham.", then the
# ham picture, then the shelf clears, as for rat.
- swipe:
    start: 417, 827
    end: 291, 592
    duration: 800
- swipe:
    start: 105, 723
    end: 417, 592
    duration: 800
- swipe:
    start: 729, 827
    end: 543, 592
    duration: 800
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: critter-picture-ham
    timeout: 15000
- takeScreenshot: critters-ham-picture
- extendedWaitUntil:
    notVisible:
      id: critter-picture
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500

# Build 21 (Dave 2026-10-25): "mom" (m row 2 cell 6 twice, o row 1 cell
# 3) and "egg" (e row 1 cell 1, g row 2 cell 2 twice). The sounds, Emma
# says the word, her caption with it, then its picture.
- swipe:
    start: 729, 827
    end: 291, 592
    duration: 800
- swipe:
    start: 417, 723
    end: 417, 592
    duration: 800
- swipe:
    start: 729, 827
    end: 543, 592
    duration: 800
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 15000
- takeScreenshot: critters-mom-caption
- extendedWaitUntil:
    visible:
      id: critter-picture-mom
    timeout: 15000
- takeScreenshot: critters-mom-picture
- extendedWaitUntil:
    notVisible:
      id: critter-picture
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- swipe:
    start: 209, 723
    end: 291, 592
    duration: 800
- swipe:
    start: 313, 827
    end: 417, 592
    duration: 800
- swipe:
    start: 313, 827
    end: 543, 592
    duration: 800
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: play-game-ribbon
    timeout: 15000
- takeScreenshot: critters-egg-caption
- extendedWaitUntil:
    visible:
      id: critter-picture-egg
    timeout: 15000
- takeScreenshot: critters-egg-picture
- extendedWaitUntil:
    notVisible:
      id: critter-picture
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: critter-seat-0
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500

# Landscape: the same 22 (the visit keeps its letters; 9 a row, 3 rows).
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: critter-x
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: critters-meadow-22-landscape
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    file: ../subflows/tap-and-confirm.yaml
    env:
      TARGET: play-game-back
      NEXT: play-place
