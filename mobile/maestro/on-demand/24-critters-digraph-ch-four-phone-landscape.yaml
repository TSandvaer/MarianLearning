# D25 of `design/native/critters-digraph.md` § 11.3, on a phone in
# landscape: the `critters-hunt-ch-four` seed (digraphs-ch current, "3" and
# "4" open; Dave's ch-e fallback e ch c j n s t with jets and nest found,
# D23) → the picker → "4" → the round in progress: the ch critter in cell 2,
# no h → ch, e, s seated (still, 1-3 seated) → t: chest's four-box slot (0)
# fills with [ch][e][s][t], the beat (3 of 4), tent stays findable, no chip
# → Back → Back. The shared steps are
# `../subflows/critters-digraph-ch-four-{open,partial,end}.yaml`.
#
# The points are for an iPhone 17 simulator in landscape (874 x 402, insets
# t0 b20 l62 r62), as 15-critters-four-round-phone-landscape.yaml: the
# meadow is 4 + 3, rows at y 272 (x 320, 376, 432, 488) and 328 (x 348, 404,
# 460); the seats at y 194, x 302, 370, 438 and 506. The slot boxes are S5's
# b 20 here, the smallest (§ 6). The digraph round's layout is a plain
# round's (D22).
#
#   e ch c j  /  n s t
#
# Screenshots go to Maestro's output (run.sh `--debug-output`, under
# MAESTRO_OUT/24-critters-digraph-ch-four-phone-landscape/).
appId: host.exp.Exponent
name: Critters digraph ch, four seats (phone landscape)
tags:
  - play
---
- launchApp:
    stopApp: true
    arguments:
      seed: critters-hunt-ch-four
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    file: ../subflows/critters-digraph-ch-four-open.yaml
    env:
      SHOT: digraph-ch-four-phone-landscape
# ch, e, s onto seats 0-2.
- swipe:
    start: 376, 272
    end: 302, 194
    duration: 800
- swipe:
    start: 320, 272
    end: 370, 194
    duration: 800
- swipe:
    start: 404, 328
    end: 438, 194
    duration: 800
    waitToSettleTimeoutMs: 300
- runFlow:
    file: ../subflows/critters-digraph-ch-four-partial.yaml
    env:
      SHOT: digraph-ch-four-phone-landscape
# ch-e-s-t: t onto seat 3.
- swipe:
    start: 460, 328
    end: 506, 194
    duration: 800
    waitToSettleTimeoutMs: 300
- runFlow:
    file: ../subflows/critters-digraph-ch-four-end.yaml
    env:
      SHOT: digraph-ch-four-phone-landscape
- setOrientation: PORTRAIT
