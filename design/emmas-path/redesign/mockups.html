<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Emma's Path redesign: 3 directions (mockups)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@500;700&family=Lilita+One&family=Nunito:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- mockup chrome (not part of the design) ---------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b2530;
        color: #f4eef6;
        font:
          15px/1.4 system-ui,
          -apple-system,
          sans-serif;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        padding: 10px 16px;
        background: #1d1921;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      #bar h1 {
        font-size: 15px;
        margin: 0 8px 0 0;
        font-weight: 700;
        color: #ffb3cd;
      }
      .seg {
        display: flex;
        gap: 4px;
        background: #2f2935;
        border-radius: 12px;
        padding: 4px;
      }
      .seg button {
        border: 0;
        border-radius: 9px;
        padding: 7px 12px;
        font: 600 14px system-ui;
        background: transparent;
        color: #d9cfe0;
        cursor: pointer;
      }
      .seg button.on {
        background: #ff8fb1;
        color: #2b1430;
      }
      #replay {
        border: 0;
        border-radius: 9px;
        padding: 7px 12px;
        font: 600 14px system-ui;
        background: #4a3f52;
        color: #fff;
        cursor: pointer;
      }
      #wrap {
        display: flex;
        gap: 24px;
        padding: 16px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
      }
      #frame {
        flex: none;
        position: relative;
      }
      #scaler {
        transform-origin: 0 0;
        position: absolute;
        top: 0;
        left: 0;
      }
      #notes {
        width: 320px;
        flex: none;
        background: #1d1921;
        border-radius: 16px;
        padding: 16px 18px;
      }
      #notes h2 {
        margin: 0 0 10px;
        font-size: 18px;
        color: #ffb3cd;
      }
      #notes p {
        margin: 0 0 10px;
      }
      #notes b {
        color: #ffd9e6;
      }
      #notes .meta {
        font-size: 12.5px;
        color: #a99bb3;
        border-top: 1px solid #3a3242;
        padding-top: 10px;
        margin-top: 6px;
      }
      #toast {
        position: absolute;
        left: 50%;
        bottom: -4px;
        transform: translate(-50%, 100%);
        background: #ffe9a8;
        color: #3b2a00;
        font: 600 13px system-ui;
        padding: 6px 12px;
        border-radius: 10px;
        opacity: 0;
        transition: opacity 0.2s;
        white-space: nowrap;
        pointer-events: none;
      }
      #toast.on {
        opacity: 1;
      }

      /* ---------- device ---------- */
      .device {
        width: 820px;
        height: 1180px;
        position: relative;
        overflow: hidden;
        border-radius: 40px;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        box-shadow:
          0 0 0 14px #111,
          0 30px 60px rgba(0, 0, 0, 0.5);
        user-select: none;
        -webkit-user-select: none;
      }
      .device * {
        -webkit-tap-highlight-color: transparent;
      }
      .abs {
        position: absolute;
      }
      .emma {
        position: absolute;
        pointer-events: none;
      }
      button {
        font-family: inherit;
        color: inherit;
      }

      /* icons: shared geometry, per-direction treatment */
      .ico {
        display: block;
        overflow: visible;
      }
      .ico .lo {
        display: none;
      }
      .dir-a .ico .art {
        filter: url(#toy);
      }
      .dir-c .ico .s {
        stroke: var(--ol);
        stroke-width: 4.5;
        paint-order: stroke;
        stroke-linejoin: round;
      }
      .dir-c .ico .lo {
        display: inline;
        stroke: var(--ol);
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* stops (one per stage) */
      .stop {
        position: absolute;
        display: grid;
        place-items: center;
        border: 0;
        padding: 0;
        transform: translate(-50%, -50%);
        cursor: pointer;
        background: none;
      }
      .stop.rel {
        position: relative;
        transform: none;
      }
      .stop > .ico {
        width: 70%;
        height: 70%;
      }
      .stop .lock {
        position: absolute;
        right: -6%;
        bottom: -6%;
        width: 40%;
        height: 40%;
        z-index: 3;
      }
      .stop .badge {
        position: absolute;
        right: -8%;
        top: -8%;
        width: 38%;
        height: 38%;
        z-index: 3;
      }
      .stop.st-locked > .ico {
        filter: blur(2.2px) saturate(0.5);
        opacity: 0.8;
      }
      .stop.st-locked::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: var(--veil, rgba(255, 250, 246, 0.45));
        pointer-events: none;
      }
      .stop.wiggle {
        animation: wig 0.5s;
      }
      @keyframes wig {
        0%,
        100% {
          rotate: 0deg;
        }
        25% {
          rotate: -7deg;
        }
        75% {
          rotate: 7deg;
        }
      }

      /* buds */
      .buds {
        display: flex;
        justify-content: center;
        gap: var(--bgap, 8px);
      }
      .buds .ico {
        width: var(--bs, 32px);
        height: var(--bs, 32px);
      }
      .buds .pop {
        animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        animation-delay: var(--d, 0.7s);
      }
      @keyframes pop {
        0% {
          transform: scale(0);
        }
        70% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }

      /* caption ribbon (mirrors Emma's speech) */
      .caption {
        position: absolute;
        left: 60px;
        right: 60px;
        bottom: 28px;
        min-height: 84px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 24px;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .caption.off {
        opacity: 0;
        transform: translateY(12px);
      }
      .caption .spk {
        width: 40px;
        height: 40px;
        flex: none;
      }

      /* press states */
      .press {
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .press.down {
        transform: translateY(8px);
      }

      /* sparkles + unlock */
      .spark {
        position: absolute;
        width: 26px;
        height: 26px;
        pointer-events: none;
        opacity: 0;
        animation: spark 0.9s ease-out both;
        animation-delay: var(--d, 1.1s);
      }
      @keyframes spark {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.3);
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) scale(1);
        }
      }
      .unlock .lock {
        animation: lockpop 0.45s ease-in both;
        animation-delay: 1.1s;
      }
      @keyframes lockpop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.35);
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }
      .unlock.st-locked > .ico {
        animation: defrost 0.4s both;
        animation-delay: 1.2s;
      }
      @keyframes defrost {
        to {
          filter: none;
          opacity: 1;
        }
      }
      .unlock.st-locked::after {
        animation: fadeout 0.4s both;
        animation-delay: 1.2s;
      }
      @keyframes fadeout {
        to {
          opacity: 0;
        }
      }
      .bloom {
        animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        animation-delay: 0.15s;
      }
      .swapA {
        animation: fadeout 0.2s both;
        animation-delay: 1.45s;
      }
      .swapB {
        opacity: 0;
        animation: fadein 0.25s both;
        animation-delay: 1.5s;
      }
      @keyframes fadein {
        to {
          opacity: 1;
        }
      }
      .slideup {
        animation: slideup 0.6s cubic-bezier(0.34, 1.4, 0.64, 1) both;
        animation-delay: 0.2s;
      }
      @keyframes slideup {
        from {
          transform: translateY(120px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .device * {
          animation-duration: 0.2s !important;
        }
      }

      /* =========================================================
   DIRECTION A: Toy Box (glossy sticker-toys, 3D slabs)
   ========================================================= */
      .dir-a {
        --font: 'Fredoka', system-ui, sans-serif;
        --bg: #fff1ea;
        --ink: #4a2545;
        --rose: #f0588a;
        --rose-d: #c23c6c;
        --sk: #ffc9a3;
        --sk2: #e59c78;
        --pk: #ff8fb1;
        --rd: #f2486f;
        --yl: #ffd23f;
        --gn: #5cc97b;
        --gn2: #3ba460;
        --bl: #5bb8f5;
        --pu: #a07cf0;
        --or: #ff9f45;
        --or2: #e9802a;
        --br: #b9774a;
        --wh: #fffdf6;
        --dk: #3b2340;
        --tan: #f1cb97;
        --tan2: #ddae74;
        --ol: #3b2340;
      }
      .dir-a .device,
      .device.dir-a {
        background: radial-gradient(
          120% 70% at 50% 0%,
          #ffe4ee 0,
          #fff1ea 55%,
          #fff6e6 100%
        );
      }
      .dir-a .stop {
        border-radius: 50%;
        border: 6px solid #fff;
        background: radial-gradient(
          circle at 34% 26%,
          #fff 0 14%,
          var(--coin, #ffe6ee) 55%,
          var(--coin2, #ffc9da) 100%
        );
        box-shadow:
          0 8px 0 var(--coinS, #e8a6bd),
          0 16px 24px rgba(74, 37, 69, 0.18);
      }
      .dir-a .stop.st-current {
        box-shadow:
          0 0 0 9px var(--rose),
          0 15px 0 var(--rose-d),
          0 24px 30px rgba(74, 37, 69, 0.25);
      }
      .dir-a .stop.st-locked {
        --coin: #efe7f3;
        --coin2: #dcd0e4;
        --coinS: #c5b6cf;
        --veil: rgba(255, 255, 255, 0.35);
      }
      .dir-a .stop.st-mastered {
        --coin: #fff3c9;
        --coin2: #ffdf85;
        --coinS: #e3b54a;
      }
      .a-chip {
        position: absolute;
        left: 28px;
        top: 28px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 20px 8px 10px;
        border-radius: 40px;
        background: linear-gradient(#fff, #fff4d6);
        box-shadow:
          0 6px 0 #ebc56a,
          0 10px 18px rgba(74, 37, 69, 0.15);
        font-size: 34px;
        font-weight: 700;
      }
      .a-chip .ico {
        width: 46px;
        height: 46px;
      }
      .a-card {
        position: absolute;
        left: 40px;
        width: 740px;
        height: 330px;
        border-radius: 48px;
        cursor: pointer;
        box-shadow:
          0 14px 0 var(--slab),
          0 26px 40px rgba(74, 37, 69, 0.16);
      }
      .a-card.press.down {
        transform: translateY(10px);
        box-shadow:
          0 4px 0 var(--slab),
          0 10px 20px rgba(74, 37, 69, 0.16);
      }
      .a-card.w-math {
        background: linear-gradient(170deg, #e6faec, #bdefcb);
        --slab: #86cf9e;
      }
      .a-card.w-word {
        background: linear-gradient(170deg, #f2eaff, #d9c8ff);
        --slab: #a991e6;
      }
      .a-title {
        position: absolute;
        left: 34px;
        top: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 30px;
        font-weight: 700;
      }
      .a-title .ico {
        width: 44px;
        height: 44px;
      }
      .a-land {
        position: absolute;
        right: 30px;
        top: 20px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 16px 4px 6px;
        border-radius: 30px;
        background: #fff;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.1);
        font-size: 30px;
        font-weight: 700;
      }
      .a-land .ico {
        width: 44px;
        height: 44px;
      }
      .a-arrow {
        position: absolute;
        width: 86px;
        height: 70px;
      }
      .a-mapbtn {
        position: absolute;
        width: 128px;
        height: 128px;
        border-radius: 36px;
        border: 0;
        background: linear-gradient(#ffffff, #ffefd2);
        box-shadow:
          0 10px 0 #e2b868,
          0 16px 24px rgba(74, 37, 69, 0.18);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .a-mapbtn .ico {
        width: 84px;
        height: 84px;
      }
      .a-mapbtn.down {
        transform: translateY(8px);
        box-shadow: 0 2px 0 #e2b868;
      }
      .a-tray {
        position: absolute;
        padding: 8px 14px;
        border-radius: 30px;
        background: #fff;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
      }
      .dir-a .caption {
        background: #fff;
        border-radius: 44px;
        box-shadow:
          0 8px 0 #f2bfd0,
          0 14px 26px rgba(74, 37, 69, 0.14);
      }
      .a-home {
        position: absolute;
        left: 28px;
        top: 24px;
        width: 96px;
        height: 96px;
        border-radius: 30px;
        border: 0;
        background: linear-gradient(#fff, #ffe6ef);
        box-shadow:
          0 8px 0 #e8a6bd,
          0 12px 20px rgba(74, 37, 69, 0.15);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .a-home .ico {
        width: 62px;
        height: 62px;
      }
      .a-shelf {
        position: absolute;
        left: 24px;
        right: 24px;
        border-radius: 44px;
        box-shadow:
          0 10px 0 var(--slab),
          0 18px 28px rgba(74, 37, 69, 0.1);
      }
      .a-landtag {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 14px 4px 4px;
        border-radius: 30px;
        background: #fff;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.1);
        font-size: 26px;
        font-weight: 700;
      }
      .a-landtag .ico {
        width: 46px;
        height: 46px;
      }
      .a-landtag.locked .ico {
        filter: blur(1.5px) saturate(0.4);
        opacity: 0.7;
      }
      .a-panel {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 470px;
        height: 380px;
        border-radius: 52px;
        background: linear-gradient(170deg, #fff, #ffe9f0);
        box-shadow:
          0 14px 0 #edb3c6,
          0 26px 40px rgba(74, 37, 69, 0.15);
      }
      .a-done {
        position: absolute;
        left: 230px;
        width: 360px;
        height: 120px;
        top: 888px;
        border: 0;
        border-radius: 60px;
        background: linear-gradient(#ff7fa6, #f0588a);
        color: #fff;
        font-size: 40px;
        font-weight: 700;
        box-shadow:
          0 12px 0 #c23c6c,
          0 20px 30px rgba(194, 60, 108, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        cursor: pointer;
      }
      .a-done .ico {
        width: 56px;
        height: 56px;
      }
      .a-done.down {
        transform: translateY(10px);
        box-shadow: 0 2px 0 #c23c6c;
      }

      /* =========================================================
   DIRECTION B: Picture Book (bold flat illustration, scenes)
   ========================================================= */
      .dir-b {
        --font: 'Baloo 2', system-ui, sans-serif;
        --bg: #fff4e2;
        --ink: #2b1b3a;
        --rose: #e8366f;
        --sk: #f9b88b;
        --sk2: #d98a5e;
        --pk: #ff6f9c;
        --rd: #e8365d;
        --yl: #ffc531;
        --gn: #2e9e5b;
        --gn2: #1f7a44;
        --bl: #3d8bff;
        --pu: #7b4ddb;
        --or: #ff8a2a;
        --or2: #e06a12;
        --br: #9c5b34;
        --wh: #ffffff;
        --dk: #2b1b3a;
        --tan: #f1b66b;
        --tan2: #d8954a;
        --ol: #2b1b3a;
      }
      .dir-b .stop {
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 10px 0 rgba(43, 27, 58, 0.22);
      }
      .dir-b .stop.st-current {
        box-shadow:
          0 0 0 12px var(--yl),
          0 20px 0 rgba(43, 27, 58, 0.22);
      }
      .dir-b .stop.st-mastered {
        background: #fff0b8;
      }
      .dir-b .stop.st-locked {
        background: #f1ecf6;
        --veil: rgba(255, 255, 255, 0.4);
      }
      .b-chip {
        position: absolute;
        left: 30px;
        top: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 22px 6px 10px;
        border-radius: 40px;
        background: #fff;
        box-shadow: 0 8px 0 rgba(43, 27, 58, 0.18);
        font-size: 36px;
        font-weight: 800;
      }
      .b-chip .ico {
        width: 46px;
        height: 46px;
      }
      .b-card {
        position: absolute;
        top: 350px;
        width: 370px;
        height: 690px;
        border-radius: 40px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 12px 0 rgba(43, 27, 58, 0.25);
      }
      .b-card.press.down {
        transform: translateY(10px);
        box-shadow: 0 2px 0 rgba(43, 27, 58, 0.25);
      }
      .b-head {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 84px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        font-size: 27px;
        font-weight: 800;
        color: #fff;
        white-space: nowrap;
      }
      .b-em {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        flex: none;
      }
      .b-head .ico {
        width: 44px;
        height: 44px;
      }
      .b-land {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 2px;
        background: #fff;
        color: var(--ink);
        border-radius: 24px;
        padding: 0 10px 0 2px;
        font-size: 26px;
      }
      .b-land .ico {
        width: 38px;
        height: 38px;
      }
      .b-mapbtn {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 96px;
        border: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .b-mapbtn .ico {
        width: 76px;
        height: 76px;
      }
      .b-mapbtn.down {
        filter: brightness(0.9);
      }
      .dir-b .caption {
        background: var(--ink);
        color: #fff;
        border-radius: 28px;
      }
      .b-home {
        position: absolute;
        left: 28px;
        top: 24px;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 0;
        background: #fff;
        box-shadow: 0 8px 0 rgba(43, 27, 58, 0.22);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .b-home .ico {
        width: 60px;
        height: 60px;
      }
      .b-flag {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px 14px 2px 4px;
        border-radius: 24px;
        background: #fff;
        font-size: 26px;
        font-weight: 800;
        box-shadow: 0 6px 0 rgba(43, 27, 58, 0.2);
      }
      .b-flag .ico {
        width: 44px;
        height: 44px;
      }
      .b-flag.locked .ico {
        filter: blur(1.5px) saturate(0.4);
        opacity: 0.7;
      }
      .b-done {
        position: absolute;
        left: 230px;
        top: 888px;
        width: 360px;
        height: 116px;
        border: 0;
        border-radius: 30px;
        background: var(--rose);
        color: #fff;
        font-size: 42px;
        font-weight: 800;
        box-shadow: 0 12px 0 #a41e4b;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
      }
      .b-done .ico {
        width: 56px;
        height: 56px;
      }
      .b-done.down {
        transform: translateY(10px);
        box-shadow: 0 2px 0 #a41e4b;
      }

      /* =========================================================
   DIRECTION C: Board Game (outlined tiles, track, flag)
   ========================================================= */
      .dir-c {
        --font: 'Nunito', system-ui, sans-serif;
        --disp: 'Lilita One', system-ui, sans-serif;
        --bg: #ffd3e3;
        --ink: #3a1d3f;
        --rose: #ff4f8b;
        --sk: #ffc29a;
        --sk2: #e0916a;
        --pk: #ff8db6;
        --rd: #ff4f6e;
        --yl: #ffd447;
        --gn: #4ccb7e;
        --gn2: #2ea35c;
        --bl: #5cb8ff;
        --pu: #a57bff;
        --or: #ff9a3c;
        --or2: #f07e1e;
        --br: #b5713f;
        --wh: #ffffff;
        --dk: #3a1d3f;
        --tan: #f6cd8e;
        --tan2: #e0aa62;
        --ol: #3a1d3f;
      }
      .device.dir-c {
        background: #ffd3e3
          repeating-conic-gradient(#ffc4d9 0 25%, #ffd3e3 0 50%) 0 0/80px 80px;
      }
      .dir-c .stop {
        border-radius: 26%;
        border: 5px solid var(--ol);
        background: #fff;
        box-shadow: 0 8px 0 var(--ol);
      }
      .dir-c .stop.st-current {
        background: var(--yl);
      }
      .dir-c .stop.st-mastered {
        background: #c9f2da;
      }
      .dir-c .stop.st-locked {
        background: #e9e1ee;
        --veil: rgba(255, 255, 255, 0.35);
      }
      .c-chip {
        position: absolute;
        left: 28px;
        top: 28px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 20px 4px 8px;
        border-radius: 20px;
        background: #fff;
        border: 5px solid var(--ol);
        box-shadow: 0 6px 0 var(--ol);
        font: 36px var(--disp);
      }
      .c-chip .ico {
        width: 46px;
        height: 46px;
      }
      .c-card {
        position: absolute;
        left: 40px;
        width: 740px;
        height: 320px;
        border-radius: 36px;
        border: 6px solid var(--ol);
        box-shadow: 0 12px 0 var(--ol);
        cursor: pointer;
      }
      .c-card.press.down {
        transform: translateY(10px);
        box-shadow: 0 2px 0 var(--ol);
      }
      .c-card.w-math {
        background: #8fe3bf radial-gradient(#7ad8b0 2.5px, transparent 3px) 0
          0/26px 26px;
      }
      .c-card.w-word {
        background: #c7b2ff radial-gradient(#b79efa 2.5px, transparent 3px) 0
          0/26px 26px;
      }
      .c-tab {
        position: absolute;
        left: 26px;
        top: -34px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 18px 4px 10px;
        border-radius: 18px;
        border: 5px solid var(--ol);
        background: #fff;
        font: 30px var(--disp);
        box-shadow: 0 5px 0 var(--ol);
      }
      .c-tab .ico {
        width: 42px;
        height: 42px;
      }
      .c-land {
        position: absolute;
        right: 26px;
        top: -34px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 16px 2px 4px;
        border-radius: 18px;
        border: 5px solid var(--ol);
        background: var(--yl);
        font: 30px var(--disp);
        box-shadow: 0 5px 0 var(--ol);
      }
      .c-land .ico {
        width: 44px;
        height: 44px;
      }
      .c-mapbtn {
        position: absolute;
        width: 124px;
        height: 124px;
        border-radius: 30px;
        border: 5px solid var(--ol);
        background: #fff;
        box-shadow: 0 8px 0 var(--ol);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .c-mapbtn .ico {
        width: 80px;
        height: 80px;
      }
      .c-mapbtn.down {
        transform: translateY(7px);
        box-shadow: 0 1px 0 var(--ol);
      }
      .c-flag {
        position: absolute;
        width: 78px;
        height: 96px;
        pointer-events: none;
        animation: bob 1.8s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-8px);
        }
      }
      .c-tray {
        position: absolute;
        padding: 6px 12px;
        border-radius: 18px;
        border: 4px solid var(--ol);
        background: #fff;
      }
      .dir-c .caption {
        font-size: 25px;
        background: #fff;
        border: 5px solid var(--ol);
        border-radius: 26px;
        box-shadow: 0 7px 0 var(--ol);
        font-family: var(--font);
        font-weight: 900;
      }
      .c-home {
        position: absolute;
        left: 28px;
        top: 24px;
        width: 96px;
        height: 96px;
        border-radius: 26px;
        border: 5px solid var(--ol);
        background: #fff;
        box-shadow: 0 7px 0 var(--ol);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .c-home .ico {
        width: 60px;
        height: 60px;
      }
      .c-landtag {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 14px 2px 4px;
        border-radius: 16px;
        border: 4px solid var(--ol);
        background: #fff;
        font: 26px var(--disp);
      }
      .c-landtag .ico {
        width: 42px;
        height: 42px;
      }
      .c-landtag.locked .ico {
        filter: blur(1.5px) saturate(0.4);
        opacity: 0.7;
      }
      .c-panel {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 470px;
        height: 380px;
        border-radius: 36px;
        border: 6px solid var(--ol);
        background: #fff6d6;
        box-shadow: 0 12px 0 var(--ol);
      }
      .c-done {
        position: absolute;
        left: 230px;
        top: 888px;
        width: 360px;
        height: 116px;
        border-radius: 30px;
        border: 6px solid var(--ol);
        background: var(--gn);
        color: #fff;
        font: 44px var(--disp);
        box-shadow: 0 10px 0 var(--ol);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
        text-shadow: 0 3px 0 var(--ol);
      }
      .c-done .ico {
        width: 56px;
        height: 56px;
      }
      .c-done.down {
        transform: translateY(8px);
        box-shadow: 0 2px 0 var(--ol);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <!-- Direction A "toy" shading: soft inner shade at the bottom, gloss at the top, small drop shadow -->
        <filter id="toy" x="-15%" y="-15%" width="130%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b" />
          <feOffset in="b" dx="-1" dy="-3" result="up" />
          <feComposite
            in="SourceAlpha"
            in2="up"
            operator="out"
            result="lower"
          />
          <feFlood flood-color="#3b1d3a" flood-opacity=".26" />
          <feComposite in2="lower" operator="in" result="shade" />
          <feOffset in="b" dx="1" dy="3" result="down" />
          <feComposite
            in="SourceAlpha"
            in2="down"
            operator="out"
            result="upper"
          />
          <feFlood flood-color="#ffffff" flood-opacity=".6" />
          <feComposite in2="upper" operator="in" result="gloss" />
          <feOffset in="SourceAlpha" dy="2.5" result="d0" />
          <feGaussianBlur in="d0" stdDeviation="1.6" result="d1" />
          <feFlood flood-color="#3b1d3a" flood-opacity=".22" />
          <feComposite in2="d1" operator="in" result="drop" />
          <feMerge>
            <feMergeNode in="drop" />
            <feMergeNode in="SourceGraphic" />
            <feMergeNode in="shade" />
            <feMergeNode in="gloss" />
          </feMerge>
        </filter>
      </defs>
    </svg>

    <div id="bar">
      <h1>Emma's Path: 3 directions</h1>
      <div class="seg" id="dirs">
        <button data-dir="a">A · Toy Box</button>
        <button data-dir="b">B · Picture Book</button>
        <button data-dir="c">C · Board Game</button>
      </div>
      <div class="seg" id="screens">
        <button data-scr="hub">1 · Hub</button>
        <button data-scr="map">2 · Number Garden map</button>
        <button data-scr="bud">3a · End: good day</button>
        <button data-scr="unlock">3b · End: unlock</button>
      </div>
      <button id="replay">Replay</button>
    </div>
    <div id="wrap">
      <div id="frame">
        <div id="scaler"><div id="device" class="device"></div></div>
        <div id="toast"></div>
      </div>
      <aside id="notes"></aside>
    </div>

      /* A stop. x,y = centre (absolute); omit for inline. tap=false -> not its own target (Hub). */
      function stop(
        node,
        size,
        state,
        { x, y, tap = true, extra = '', cls = '' } = {},
      ) {
        const pos = x == null ? 'rel' : ''
        const st =
          x == null
            ? `width:${size}px;height:${size}px`
            : `width:${size}px;height:${size}px;left:${x}px;top:${y}px`
        return `<div class="stop st-${state} ${pos} ${cls}" style="${st}" ${tap ? `data-node="${node}" role="button" aria-label="${NAMES[node]}"` : ''}>${icon(node)}${state === 'locked' ? `<span class="lock">${icon('ui-lock')}</span>` : ''}${state === 'mastered' ? `<span class="badge">${icon('ui-bloom')}</span>` : ''}${extra}</div>`
      }
      function buds(
        good,
        req,
        size,
        { gap = 8, popIdx = -1, delay = 0.7 } = {},
      ) {
        let s = ''
        for (let i = 0; i < req; i++) {
          const open = i < good || i === popIdx
          s +=
            i === popIdx
              ? `<span style="position:relative;width:${size}px;height:${size}px">${sized('bud-closed', size, '')}<span class="pop" style="position:absolute;inset:0;--d:${delay}s">${sized('bud-open', size)}</span></span>`
              : sized(open ? 'bud-open' : 'bud-closed', size)
        }
        return `<div class="buds" style="--bs:${size}px;--bgap:${gap}px">${s}</div>`
      }

      /* map geometry shared by all three directions: 4 lands, bottom -> top, snaking */
      function mapStops() {
        const out = []
        NG_LANDS.forEach((land, i) => {
          const top = 1050 - (i + 1) * 230
          const cy = top + 132
          let xs =
            land.nodes.length === 1
              ? [150]
              : land.nodes.length === 4
                ? [150, 323, 497, 670]
                : [150, 410, 670]
          if (i === 2) xs = [...xs].reverse()
          land.top = top
          land.nodes.forEach((n, j) =>
            out.push({ node: n, x: xs[j], y: cy, land: i }),
          )
        })
        return out
      }
      function trail(stops, { wave = 0 } = {}) {
        const seg = []
        for (let i = 0; i < stops.length - 1; i++) {
          const a = stops[i],
            b = stops[i + 1]
          const d =
            a.land === b.land
              ? wave
                ? `M${a.x} ${a.y} Q${(a.x + b.x) / 2} ${a.y + (i % 2 ? wave : -wave)} ${b.x} ${b.y}`
                : `M${a.x} ${a.y} L${b.x} ${b.y}`
              : `M${a.x} ${a.y} C${a.x + (wave ? 60 : 0)} ${a.y - 120} ${b.x - (wave ? 60 : 0)} ${b.y + 120} ${b.x} ${b.y}`
          seg.push({ d, walked: i < NG_ORDER.indexOf(CURRENT) })
        }
        return seg

            top,
          ) => `<div class="a-card press w-${w.key}" style="top:${top}px" data-card="${w.name}">
    <div class="a-title">${icon(w.emblem)}<span>${w.name}</span></div>
    <div class="a-land">${icon(w.landEmblem)}<span>${w.land}</span></div>
    ${stop(w.cur, 190, 'current', { x: 170, y: 180, tap: false })}
    <div class="a-tray" style="left:95px;top:268px">${buds(w.good, w.req, 40, { gap: 10 })}</div>
    <div class="a-arrow" style="left:300px;top:146px">${icon('ui-arrow')}</div>
    ${stop(w.next, 140, 'locked', { x: 470, y: 182, tap: false })}
    <button class="a-mapbtn press" style="left:590px;top:118px" data-map="${w.key}" aria-label="${w.name} map">${icon('ui-map')}</button>
  </div>`
          return `<div class="a-chip">${icon('ui-star')}<span>11</span></div>
   <img class="emma" src="${EMMA.waving}" alt="" style="left:270px;top:10px;width:290px;height:290px">
   ${card(WORLDS.math, 330)}${card(WORLDS.word, 710)}${caption()}`
        },
        map() {
          const S = mapStops()
          const tints = ['#E3F6D9', '#FFF0C7', '#DDF1FF', '#EFE4FF'],
            slabs = ['#B3DE9F', '#EFCF7B', '#A9D3F0', '#C8B2EE']
          let h = `<button class="a-home" data-go="hub" aria-label="Home">${icon('ui-house')}</button>
   <div class="abs" style="left:300px;top:30px;display:flex;gap:10px;align-items:center;font-size:34px;font-weight:700">${sized('ui-flowers', 60)}Number Garden</div>`
          NG_LANDS.forEach((l, i) => {
            const locked = stateOf(l.nodes[0]) === 'locked'
            h += `<div class="a-shelf" style="top:${l.top + 22}px;height:196px;background:${tints[i]};--slab:${slabs[i]}"></div>
     <div class="a-landtag ${locked ? 'locked' : ''}" style="left:40px;top:${l.top + 2}px" data-land="${i}">${icon(l.emblem)}<span>${l.n}</span>${locked ? sized('ui-lock', 30) : ''}</div>`
          })
          h += `<svg class="abs" width="820" height="1180" style="left:0;top:0;pointer-events:none">${trail(
            S,
          )
            .map(
              (s) =>
                `<path d="${s.d}" stroke="${s.walked ? '#F0588A' : '#fff'}" stroke-width="26" fill="none" stroke-linecap="round"/>${s.walked ? '' : `<path d="${s.d}" stroke="#E8C6D4" stroke-width="8" stroke-dasharray="2 22" fill="none" stroke-linecap="round"/>`}`,
            )
            .join('')}</svg>`
          S.forEach((s) => {
            const st = stateOf(s.node)
            h += stop(s.node, st === 'current' ? 124 : 108, st, {
              x: s.x,
              y: s.y,
            })
            if (st === 'current')
              h +=
                `<div class="a-tray abs" style="left:${s.x - 78}px;top:${s.y + 70}px;padding:4px 10px">${buds(2, 3, 36, { gap: 8 })}</div>` +
                emmaOn(s)
          })
          return (
            h +
            caption(`Here is your path! You are on ${NAMES[CURRENT]}.`, false)
          )
        },
        end(kind) {
          return endScreen('a', kind)
        },
      }

      /* ===================== DIRECTION B: Picture Book ===================== */
      const B = {
        scene(w) {
          const m = w.key === 'math'
          const sky = m ? '#FFE3A3' : '#5B3CC4',
            hill2 = m ? '#7ACB7E' : '#7A5AE0',
            hill1 = m ? '#3FAE66' : '#9A7BF2',
            road = m ? '#FFF4D9' : '#E9DEFF',
            head = m ? '#2E9E5B' : '#7B4DDB'
          const deco = m
            ? `<circle cx="300" cy="150" r="44" fill="#FFC531"/>`
            : [
                [60, 130],
                [300, 120],
                [250, 220],
                [90, 260],
                [320, 300],
              ]
                .map(
                  ([x, y]) =>
                    `<circle cx="${x}" cy="${y}" r="5" fill="#FFE27A"/>`,
                )
                .join('') +
              `<circle cx="300" cy="150" r="36" fill="#FFF3C4"/><circle cx="316" cy="140" r="32" fill="${sky}"/>`
          return `<svg class="abs" width="370" height="690" style="left:0;top:0"><rect width="370" height="690" fill="${sky}"/>${deco}
   <path d="M0 330 Q110 250 220 300 T370 270 V690 H0 Z" fill="${hill2}"/><path d="M0 440 Q185 360 370 440 V690 H0 Z" fill="${hill1}"/>
   <path d="M185 210 C 320 270, 40 330, 185 410" stroke="${road}" stroke-width="40" fill="none" stroke-linecap="round"/>
   <rect y="0" width="370" height="84" fill="${head}"/></svg>`
        },
        hub() {
          const card = (w, left) => {
            const m = w.key === 'math'
            return `<div class="b-card press w-${w.key}" style="left:${left}px" data-card="${w.name}">${B.scene(w)}
    <div class="b-head"><span class="b-em">${icon(w.emblem)}</span><span>${w.name}</span><span class="b-land">${icon(w.landEmblem)}${w.land}</span></div>
    ${stop(w.next, 130, 'locked', { x: 185, y: 200, tap: false })}
    ${stop(w.cur, 196, 'current', { x: 185, y: 420, tap: false })}
    <div class="abs" style="left:0;right:0;top:532px">${buds(w.good, w.req, 62, { gap: 18 })}</div>
    <button class="b-mapbtn" style="background:${m ? '#1F7A44' : '#5530B8'}" data-map="${w.key}" aria-label="${w.name} map">${icon('ui-map')}</button></div>`
          }
          return `<div class="abs" style="left:0;right:0;top:0;height:330px;background:#FFE1EA;border-radius:0 0 50% 50% / 0 0 60px 60px"></div>
   <div class="b-chip">${icon('ui-star')}<span>11</span></div>
   <img class="emma" src="${EMMA.waving}" alt="" style="left:270px;top:20px;width:290px;height:290px">
   ${card(WORLDS.math, 30)}${card(WORLDS.word, 420)}${caption()}`
        },
        map() {
          const S = mapStops()
          const hills = ['#3FAE66', '#F2B33D', '#34A3C9', '#9A7BF2']
          let h = `<svg class="abs" width="820" height="1180" style="left:0;top:0"><rect width="820" height="1180" fill="#BFE6FF"/><circle cx="700" cy="70" r="46" fill="#FFC531"/>`
          for (let i = 3; i >= 0; i--) {
            const t = NG_LANDS[i].top
            h += `<path d="M0 ${t + 40} Q205 ${t - 10} 410 ${t + 30} T820 ${t + 20} V1180 H0 Z" fill="${hills[i]}"/>`
          }
          h += `<rect y="1050" width="820" height="130" fill="#2E8A50"/>`
          trail(S, { wave: 28 }).forEach((s) => {
            h += `<path d="${s.d}" stroke="${s.walked ? '#FFF4D9' : 'rgba(255,255,255,.45)'}" stroke-width="30" fill="none" stroke-linecap="round" ${s.walked ? '' : 'stroke-dasharray="26 18"'}/>`
          })
          h += `</svg><button class="b-home" data-go="hub" aria-label="Home">${icon('ui-house')}</button>`
          NG_LANDS.forEach((l, i) => {
            const locked = stateOf(l.nodes[0]) === 'locked'
            h += `<div class="b-flag ${locked ? 'locked' : ''}" style="left:${i === 2 ? 660 : 30}px;top:${l.top + 4}px" data-land="${i}">${icon(l.emblem)}<span>${l.n}</span>${locked ? sized('ui-lock', 28) : ''}</div>`
          })
          S.forEach((s) => {
            const st = stateOf(s.node)
            h += stop(s.node, st === 'current' ? 126 : 110, st, {
              x: s.x,
              y: s.y,
            })
            if (st === 'current')
              h +=
                `<div class="abs" style="left:${s.x - 90}px;top:${s.y + 74}px;width:180px">${buds(2, 3, 40, { gap: 10 })}</div>` +
                emmaOn(s)
          })
          return (
            h +
            caption(`Here is your path! You are on ${NAMES[CURRENT]}.`, false)
          )
        },
        end(kind) {
          return endScreen('b', kind)
        },
      }

      /* ===================== DIRECTION C: Board Game ===================== */
      const C = {
        hub() {
          const card = (
            w,
            top,
          ) => `<div class="c-card press w-${w.key}" style="top:${top}px" data-card="${w.name}">
    <div class="c-tab">${icon(w.emblem)}<span>${w.name}</span></div>
    <div class="c-land">${icon(w.landEmblem)}<span>${w.land}</span></div>
    ${stop(w.cur, 196, 'current', { x: 150, y: 150, tap: false })}
    <div class="c-flag" style="left:204px;top:26px;width:62px;height:78px">${icon('ui-flag')}</div>
    <div class="c-tray" style="left:66px;top:252px">${buds(w.good, w.req, 36, { gap: 8 })}</div>
    <svg class="abs" width="120" height="70" style="left:272px;top:118px">${[0, 1, 2].map((k) => `<path d="M${10 + k * 36} 10 L${34 + k * 36} 35 L${10 + k * 36} 60" stroke="#3A1D3F" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${0.35 + k * 0.3}"/>`).join('')}</svg>
    ${stop(w.next, 144, 'locked', { x: 475, y: 152, tap: false })}
    <button class="c-mapbtn press" style="left:582px;top:90px" data-map="${w.key}" aria-label="${w.name} map">${icon('ui-map')}</button>
  </div>`
          return `<div class="c-chip">${icon('ui-star')}<span>11</span></div>
   <img class="emma" src="${EMMA.waving}" alt="" style="left:270px;top:6px;width:280px;height:280px">
   ${card(WORLDS.math, 340)}${card(WORLDS.word, 720)}${caption()}`
        },
        map() {
          const S = mapStops()
          const cols = ['#9BE7C4', '#FFE68A', '#9FD6FF', '#D2BFFF']
          let h = `<button class="c-home" data-go="hub" aria-label="Home">${icon('ui-house')}</button>
   <div class="abs" style="left:300px;top:34px;display:flex;gap:10px;align-items:center;font:38px var(--disp)">${sized('ui-flowers', 60)}Number Garden</div>
   <div class="abs" style="left:18px;right:18px;top:136px;height:922px;border-radius:34px;border:6px solid var(--ol);background:#FFF8EC;box-shadow:0 10px 0 var(--ol)"></div>`
          NG_LANDS.forEach((l, i) => {
            const locked = stateOf(l.nodes[0]) === 'locked'
            h += `<div class="abs" style="left:34px;right:34px;top:${Math.max(l.top + 20, 150)}px;height:${l.top + 20 < 150 ? 200 : 206}px;border-radius:26px;border:4px solid var(--ol);background:${cols[i]}"></div>
   <div class="c-landtag ${locked ? 'locked' : ''}" style="left:${i === 2 ? 630 : 50}px;top:${l.top + 2}px" data-land="${i}">${icon(l.emblem)}<span>${l.n}</span>${locked ? sized('ui-lock', 28) : ''}</div>`
          })
          // track: small square spaces along each segment
          let sq = ''
          trail(S).forEach((s) => {
            const p = document.createElementNS(
              'http://www.w3.org/2000/svg',
              'path',
            )
            p.setAttribute('d', s.d)
            const len = p.getTotalLength()
            const n = Math.floor(len / 48)
            for (let k = 1; k < n; k++) {
              const t = (k * len) / n
              if (t < 66 || len - t < 66) continue
              const q = p.getPointAtLength(t)
              sq += `<rect x="${q.x - 13}" y="${q.y - 13}" width="26" height="26" rx="6" fill="${s.walked ? '#FF4F8B' : '#fff'}" stroke="#3A1D3F" stroke-width="4"/>`
            }
          })
          h += `<svg class="abs" width="820" height="1180" style="left:0;top:0;pointer-events:none">${sq}</svg>`
          S.forEach((s) => {
            const st = stateOf(s.node)
            h += stop(s.node, st === 'current' ? 122 : 106, st, {
              x: s.x,
              y: s.y,
            })
            if (st === 'current')
              h +=
                `<div class="c-tray abs" style="left:${s.x - 76}px;top:${s.y + 72}px;padding:3px 8px">${buds(2, 3, 36, { gap: 6 })}</div>` +
                emmaOn(s)
          })
          return (
            h +
            caption(`Here is your path! You are on ${NAMES[CURRENT]}.`, false)
          )
        },
        end(kind) {
          return endScreen('c', kind)
        },
      }

      /* ===================== session end (shared choreography, per-direction skin) ===================== */
      function endScreen(d, kind) {
        const chip = { a: 'a-chip', b: 'b-chip', c: 'c-chip' }[d]
        const done = { a: 'a-done', b: 'b-done', c: 'c-done' }[d]
        let panel
        if (d === 'a') panel = `<div class="a-panel"></div>`
        else if (d === 'b')
          panel = `<svg class="abs" width="820" height="460" style="left:0;top:440px"><path d="M0 120 Q410 0 820 120 V460 H0 Z" fill="#A8E09A"/><path d="M0 250 Q410 170 820 250 V460 H0 Z" fill="#86D07E"/></svg>`
        else panel = `<div class="c-panel"></div>`
        const top = `<div class="${chip}">${icon('ui-star')}<span>+8</span></div>`
        const btn = `<button class="${done} press" data-go="hub">${icon('ui-check')}<span>All done</span></button>`
        if (kind === 'bud') {
          const line = 'Look! A new flower for letter sounds!'
          return `${top}<img class="emma" src="${EMMA.cheering}" alt="" style="left:225px;top:60px;width:370px;height:370px">${panel}
     <div class="slideup">${stop('letter-sounds', 210, 'current', { x: 410, y: 615 })}
     <div class="abs" style="left:0;right:0;top:742px">${buds(1, 3, 72, { gap: 22, popIdx: 1, delay: 0.9 })}</div></div>
     ${btn}${caption(line)}`
        }
        const line =
          'You learned adding to twenty! Now you can do taking away to ten!'
        const trailSvg =
          d === 'c'
            ? `<svg class="abs" width="820" height="1180" style="left:0;top:0;pointer-events:none">${[330, 390, 450].map((x, k) => `<rect x="${x - 14}" y="${640 - 14}" width="28" height="28" rx="6" fill="#FF4F8B" stroke="#3A1D3F" stroke-width="4"/>`).join('')}</svg>`
            : `<svg class="abs" width="820" height="1180" style="left:0;top:0;pointer-events:none"><path d="M230 650 Q410 560 590 650" stroke="${d === 'a' ? '#F0588A' : '#FFF4D9'}" stroke-width="26" fill="none" stroke-linecap="round"/></svg>`
        return `${top}<img class="emma swapA" src="${EMMA.idle}" alt="" style="left:240px;top:70px;width:340px;height:340px"><img class="emma swapB" src="${EMMA.cheering}" alt="" style="left:225px;top:60px;width:370px;height:370px">${panel}${trailSvg}
    <div class="stop st-mastered" style="width:170px;height:170px;left:220px;top:650px" data-node="add-to-20">${icon('add-to-20')}<span class="badge bloom">${icon('ui-bloom')}</span></div>
    <div class="abs" style="left:135px;top:750px;width:170px">${buds(3, 3, 44, { gap: 6, popIdx: 2, delay: 0.1 })}</div>
    ${stop('sub-to-10', 210, 'locked', { x: 590, y: 650, cls: 'unlock' })}
    ${sparks(590, 650, 8, 1.15)}
    ${btn}${caption(line)}`
      }

      /* ===================== notes (idea / why / risk) ===================== */
      const NOTES = {
        a: {
          t: 'A · Toy Box',
          idea: 'Every stage is a glossy, squishy toy-coin on thick press-able slabs. Each Hub card is one big coin ("you are here", with its flowers in a tray) and an arrow to one frosted, padlocked coin ("next"). The map is the same coins on stacked land shelves.',
          why: 'Concrete objects you could pick up read instantly without words, and the press-down slabs answer every tap physically, the way current kids’ apps (Khan Kids, Duolingo ABC) do. Full-width cards give the biggest hero of the three.',
          risk: 'The gloss uses an SVG filter on every icon, which costs paint time on an older iPad; in the build it should be baked into the art. "Coins" could drift toward a collect-them-all feel if anyone later adds counts or rarity.',
        },
        b: {
          t: 'B · Picture Book',
          idea: 'Each world card is a small illustrated landscape: the current picture sits on a hill with real flowers growing in front of it, and the road climbs to the next picture. The map is the same landscape zoomed out, one hill per land.',
          why: 'One scene tells one story without text, and "climb the hill" matches the map (bottom to top), so the Hub and the map teach each other. The flowers on the hill are the same bud idea, drawn as part of the world.',
          risk: 'The most art-heavy option: every world needs a scene, and the stop pictures must stay readable on busy colour. Side-by-side cards are 370 pt wide, so the hero is smaller than in A or C.',
        },
        c: {
          t: 'C · Board Game',
          idea: 'The path is a board game: chunky outlined tiles, a "you are here" flag on the current tile, a chevron track to the next prize tile, and the map is the whole board with Emma standing on her square.',
          why: 'Every child knows "move along the squares to the next prize", so it needs no language. Thick dark outlines give the strongest contrast at arm’s length.',
          risk: 'Board games suggest dice and turns, which invites someone to add chance later (dice rolls are variable rewards, a dark pattern). The bold black outlines read younger and may clash with Emma’s soft manhwa art.',
        },
      }

      /* ===================== app ===================== */
      const DIRS = { a: A, b: B, c: C }
      let dir = 'a',
        scr = 'hub'
      const dev = document.getElementById('device')
      function render() {
        dev.className = 'device dir-' + dir
        dev.innerHTML =
          scr === 'hub'
            ? DIRS[dir].hub()
            : scr === 'map'
              ? DIRS[dir].map()
              : DIRS[dir].end(scr)
        document
          .querySelectorAll('#dirs button')
          .forEach((b) => b.classList.toggle('on', b.dataset.dir === dir))
        document
          .querySelectorAll('#screens button')
          .forEach((b) => b.classList.toggle('on', b.dataset.scr === scr))
        const n = NOTES[dir]
        document.getElementById('notes').innerHTML =
          `<h2>${n.t}</h2><p><b>Idea:</b> ${n.idea}</p><p><b>Why it fits Marian:</b> ${n.why}</p><p><b>Main risk:</b> ${n.risk}</p>
   <p class="meta">Data: Number Garden — adding to ten mastered, on adding to twenty with 2 of 3 good days. Word Song — on letter sounds, 1 good day.<br>Tap a map stop or land tag for Emma’s line · tap a card (press state) · tap the map button · "All done" returns to the Hub.</p>`
        location.hash = dir + '-' + scr
        if (scr === 'bud' || scr === 'unlock') {
          setTimeout(
            () => {
              const c = document.getElementById('cap')
              c && c.classList.remove('off')
            },
            scr === 'bud' ? 1000 : 1550,
          )
        }
        fit()
      }
      function say(t) {
        const c = document.getElementById('cap')
        if (!c) return
        document.getElementById('captxt').textContent = t
        c.classList.remove('off')
      }
      let tt
      function toast(t) {
        const e = document.getElementById('toast')
        e.textContent = t
        e.classList.add('on')
        clearTimeout(tt)
        tt = setTimeout(() => e.classList.remove('on'), 2200)
      }
      function fit() {
        const wide = innerWidth >= 820 * 0.45 + 360 + 60
        const availH =
          innerHeight - document.getElementById('bar').offsetHeight - 70
        const availW = innerWidth - (wide ? 360 : 0) - 64
        const s = Math.max(0.3, Math.min(availH / 1180, availW / 820, 1))
        document.getElementById('scaler').style.transform = `scale(${s})`
        const fr = document.getElementById('frame')
        fr.style.width = 820 * s + 'px'
        fr.style.height = 1180 * s + 'px'
      }
      dev.addEventListener('pointerdown', (e) => {
        const p = e.target.closest('.press')
        if (p) {
          p.classList.add('down')
          setTimeout(() => p.classList.remove('down'), 160)
        }
      })
      dev.addEventListener('click', (e) => {
        const m = e.target.closest('[data-map]')
        if (m) {
          e.stopPropagation()
          if (m.dataset.map === 'math') {
            scr = 'map'
            render()
          } else
            toast(
              'Word Song map: same layout as the Number Garden map (not drawn in this mockup)',
            )
          return
        }
        const g = e.target.closest('[data-go]')
        if (g) {
          scr = g.dataset.go
          render()
          return
        }
        const n = e.target.closest('[data-node]')
        if (n) {
          n.classList.remove('wiggle')
          void n.offsetWidth
          if (n.classList.contains('st-locked')) n.classList.add('wiggle')
          say(tapLine(n.dataset.node))
          return
        }
        const l = e.target.closest('[data-land]')
        if (l) {
          const land = NG_LANDS[+l.dataset.land]
          const locked = stateOf(land.nodes[0]) === 'locked'
          say(
            locked
              ? `Land ${land.n}: ${land.name}! First, ${NAMES[CURRENT]}.`
              : `Land ${land.n}: ${land.name}.`,
          )
          return
        }
        const c = e.target.closest('[data-card]')
        if (c) {
          toast('Card tap starts a ' + c.dataset.card + ' session')
        }
      })
      document.getElementById('dirs').onclick = (e) => {
        if (e.target.dataset.dir) {
          dir = e.target.dataset.dir
          render()
        }
      }
      document.getElementById('screens').onclick = (e) => {
        if (e.target.dataset.scr) {
          scr = e.target.dataset.scr
          render()
        }
      }
      document.getElementById('replay').onclick = render
      addEventListener('resize', fit)
      const h = location.hash.slice(1).split('-')
      if (DIRS[h[0]]) dir = h[0]
      if (['hub', 'map', 'bud', 'unlock'].includes(h[1])) scr = h[1]
      render()
    </script>
  </body>
</html>
