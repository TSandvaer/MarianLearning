# .github/workflows/maestro.yml
#
# Runs the native app's Maestro flows (mobile/maestro/run.sh, all four) on
# an iOS Simulator with Expo Go, on a standard GitHub-hosted macOS runner
# (free for this public repo). See mobile/maestro/README.md § CI.
#
# No production call can happen, and the job uses no repository secrets:
#   - run.sh bundles with EXPO_PUBLIC_API_BASE=http://127.0.0.1:9 (a closed
#     port; it refuses to start if something listens there), unsets
#     EXPO_PUBLIC_PROGRESS_API_SECRET and sets EXPO_NO_DOTENV=1.
#   - Metro runs with --offline: no manifest signing against expo.dev.
#   - `permissions: contents: read`, and no `secrets.*` anywhere below.
#
# Pinned downloads, each checked against a SHA-256 before use:
#   - Maestro CLI: the cli-<version> release's maestro.zip (the hash is the
#     release's own checksums_sha256.txt).
#   - Expo Go for the iOS Simulator: the tarball from
#     github.com/expo/expo-go-releases, the same URL the Expo versions API
#     (exp.host/--/api/v2/versions, sdkVersions["57.0.0"].iosClientUrl) and
#     `npx expo start --go --ios` use for SDK 57.

name: maestro

on:
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'packages/core/**', '.github/workflows/maestro.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'packages/core/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Maestro (iOS Simulator + Expo Go)
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      MAESTRO_VERSION: '2.11.0'
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
      EXPO_GO_VERSION: '57.0.9'
      EXPO_GO_SHA256: faff18034c9f3504ea4786f07350efab604610c61cfcabd0f2191fc4416a7614
      SIM_DEVICE_TYPE: iPad Pro 11-inch (M5)
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      # A cold hosted runner starts Maestro's XCTest driver slowly (default
      # 15 s). Maestro's own iOS CI on macos-26 uses 240 s.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17 (Maestro)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: npm ci (mobile)
        working-directory: mobile
        run: npm ci

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Create and boot the iPad simulator
        run: |
          xcrun simctl list runtimes
          udid="$(xcrun simctl create "Maestro iPad" "$SIM_DEVICE_TYPE" "$SIM_RUNTIME")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "MAESTRO_DEVICE=$udid" >> "$GITHUB_ENV"

      - name: Install Expo Go ${{ env.EXPO_GO_VERSION }} into the simulator
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/expo-go.tar.gz" \
            "https://github.com/expo/expo-go-releases/releases/download/Expo-Go-${EXPO_GO_VERSION}/Expo-Go-${EXPO_GO_VERSION}.tar.gz"
          echo "${EXPO_GO_SHA256}  $RUNNER_TEMP/expo-go.tar.gz" | shasum -a 256 -c -
          # The tarball holds the .app's contents, not the .app folder.
          mkdir -p "$RUNNER_TEMP/ExpoGo.app"
          tar -xzf "$RUNNER_TEMP/expo-go.tar.gz" -C "$RUNNER_TEMP/ExpoGo.app"
          xcrun simctl install "$MAESTRO_DEVICE" "$RUNNER_TEMP/ExpoGo.app"
          app="$(xcrun simctl get_app_container "$MAESTRO_DEVICE" host.exp.Exponent)"
          installed="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          echo "Expo Go $installed on $MAESTRO_DEVICE"
          [[ "$installed" == "$EXPO_GO_VERSION" ]] ||
            { echo "::error::expected Expo Go $EXPO_GO_VERSION, got $installed"; exit 1; }

      - name: Run the Maestro flows
        timeout-minutes: 60
        env:
          MAESTRO_OUT: ${{ runner.temp }}/maestro-out
        run: mobile/maestro/run.sh 2>&1 | tee "$RUNNER_TEMP/maestro-run.log"

      - name: Results summary
        if: always()
        run: |
          log="$RUNNER_TEMP/maestro-run.log"
          [[ -f "$log" ]] || exit 0
          {
            echo '### Maestro'
            echo '```'
            sed -n '/── Maestro results/,$p' "$log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Maestro output (failure only)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/maestro-out
            ${{ runner.temp }}/maestro-run.log
            ~/.maestro/tests
          if-no-files-found: warn
          retention-days: 14
