# Playwright e2e harness — runs against the production build.
#
# Ticket 86c9kwnmx (P0.1 from the 2026-05-02 polish audit). Closes the
# "no e2e on PRs" gap that allowed every cross-screen audio-race P0 of the
# last 10 PRs to ship undetected.
#
# Trigger: every pull_request targeting main (PR review gate), plus every
# push to main (post-merge regression coverage). Feature-branch pushes
# DON'T fire e2e directly — `pull_request` already covers them once a PR
# exists, and pre-PR prototype pushes don't need a CI gate. This avoids
# the double-fire that ran e2e twice per PR push under the old config.
# The job builds the prod bundle, boots `vite preview`, and runs all
# Playwright specs against it. /api/claude is mocked at the route level
# (see e2e/_helpers/mockClaude.ts) so the suite never hits Anthropic / Azure.
#
# Job split (2026-05-22, chore/ci-vitest-split). Authorized fix from the
# 2026-05-22 decisions-while-away.md entry "Cancel 4 hung CI runs": canon-lint
# + typecheck + lint + vitest now run in `fast-gate` (~3-5 min total), and
# Playwright runs in `e2e` gated by `needs: fast-gate`. Two motivations:
#   1. Cheap fast-fail. A vitest / typecheck / lint / canon-lint regression
#      now surfaces in 3-5 min instead of waiting on a 35-min Playwright run.
#   2. Runner-minute discipline. When the fast gate fails we never burn a
#      Playwright runner on a PR that can't ship anyway. Wave-5 e2e runtimes
#      legitimately stretched to 2-3 hours (per the 2026-05-22 retro), so
#      saving a Playwright runner-slot on cheap failures matters for parallel
#      PR throughput when free-tier concurrency caps bite.
# Trade-off accepted: `needs: fast-gate` adds 3-5 min of latency to the e2e
# signal vs running the two jobs in parallel. The throughput benefit on
# cheap-failure PRs outweighs the latency cost on green-fast-gate PRs given
# concurrency-cap pressure during high-PR-volume sessions.

name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run when a new commit lands on the same ref. Two rapid
# pushes to the same PR branch will dump the first run rather than running
# the suite twice in parallel — cheaper, and frees up the runner cap during
# fix-iterate cycles. Different group keys still proceed in parallel:
#   - Push to PR-A while PR-B is running   → both proceed (refs differ)
#   - Push to PR-A while main is running   → both proceed (refs differ)
#   - Push to PR-A while PR-A is running   → second cancels first  ← target
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    # Cheap fast-fail signals — typecheck + lint + canon-lint + vitest.
    # Targets ~3-5 min total wall-clock. Any failure here short-circuits
    # the PR before a Playwright runner is allocated.
    name: Fast gate (typecheck + lint + canon-lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck (tsc -b --noEmit)
        run: yarn typecheck

      - name: ESLint
        run: yarn lint

      - name: Canon lint (ASCII / SSML-notation guard)
        # Ticket 86c9qhr9k. Walks public/canon/**/*.json and fails on any
        # non-ASCII codepoint, slash-IPA notation (`/p/`), or angle-tag
        # (`<phoneme...>`) substring in utterance `text`. Cheap node-only
        # check (~2s).
        run: yarn canon:lint

      - name: Vitest (unit + component suite)
        # Retro action 2 (2026-05-22). Closes the trust-the-author gap that
        # let all 11 Waves 3+4 PRs ship without a CI-enforced vitest run.
        # Uses `yarn test` (== `vitest run`) so the CI invocation matches
        # the local script in package.json.
        run: yarn test
        env:
          CI: 'true'

  e2e:
    name: Playwright (Chromium + WebKit)
    runs-on: ubuntu-latest
    # Gate the expensive Playwright run on the cheap fast-gate. When the
    # fast gate fails, no Playwright runner is allocated — saving ~25-35 min
    # of runner-minutes on cheap-failure PRs and freeing concurrency-cap
    # headroom for green PRs to land in parallel.
    needs: fast-gate
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Bump key when @playwright/test version in package.json bumps
          # so a stale cache doesn't pin us to an outdated browser bundle.
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Install Playwright browsers
        # `--with-deps` pulls in the system libraries Chromium / WebKit need
        # on Ubuntu (libgbm, libnss3, etc.). On a cache HIT this still runs
        # but is a no-op for the binaries.
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e suite
        run: yarn e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
