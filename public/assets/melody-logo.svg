<?xml version="1.0" encoding="UTF-8"?>
<!--
  melody-logo.svg
  Splash wordmark for Marian Tutor (My-Melody-inspired, original artwork).
  - Stylised pink bunny mark (rounded ears, hood silhouette, soft cheeks)
  - "Melody" wordmark in rounded sans
  - Palette: my-pink #FFC0CB, my-rose #F48FB1, my-cream #FFF5F0, ink #3D2B3D, sparkle #FFD966
  - viewBox 0 0 480 360 — author at 240pt wide, scales perfectly on iPad Retina
  - No filters/gradients beyond simple <radialGradient> for cheek blush, keeps file lean
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Melody">
  <title>Melody</title>
  <defs>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F48FB1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F48FB1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bunny mark, centered top -->
  <g transform="translate(240 130)">
    <!-- Hood / outer silhouette: rounded triangle with two long ear lobes -->
    <path d="
      M -90 30
      C -96 -10, -80 -50, -60 -70
      C -56 -90, -42 -110, -22 -112
      C -10 -116, 10 -116, 22 -112
      C 42 -110, 56 -90, 60 -70
      C 80 -50, 96 -10, 90 30
      C 86 56, 60 78, 30 84
      C 10 88, -10 88, -30 84
      C -60 78, -86 56, -90 30 Z"
      fill="#FFC0CB" stroke="#F48FB1" stroke-width="4" stroke-linejoin="round"/>

    <!-- Inner face: cream oval -->
    <ellipse cx="0" cy="20" rx="58" ry="52" fill="#FFF5F0"/>

    <!-- Ear inner panels (soft pink) -->
    <path d="M -40 -78 C -36 -96, -28 -104, -22 -104 C -18 -90, -22 -72, -30 -58 Z"
      fill="#FFD3DC"/>
    <path d="M  40 -78 C  36 -96,  28 -104,  22 -104 C  18 -90,  22 -72,  30 -58 Z"
      fill="#FFD3DC"/>

    <!-- Eyes: simple dots, soft aubergine ink -->
    <circle cx="-18" cy="14" r="4.5" fill="#3D2B3D"/>
    <circle cx=" 18" cy="14" r="4.5" fill="#3D2B3D"/>

    <!-- Cheek blush -->
    <ellipse cx="-30" cy="32" rx="10" ry="6" fill="url(#cheek)"/>
    <ellipse cx=" 30" cy="32" rx="10" ry="6" fill="url(#cheek)"/>

    <!-- Tiny nose + smile -->
    <path d="M -3 26 Q 0 30, 3 26" fill="none" stroke="#3D2B3D" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M -8 36 Q 0 44, 8 36" fill="none" stroke="#3D2B3D" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Heart accent on hood -->
    <path d="M 0 -28
      C -4 -36, -16 -36, -16 -26
      C -16 -18, -8 -12, 0 -6
      C 8 -12, 16 -18, 16 -26
      C 16 -36, 4 -36, 0 -28 Z"
      fill="#F48FB1"/>

    <!-- Sparkle -->
    <path d="M 56 -52 L 58 -46 L 64 -44 L 58 -42 L 56 -36 L 54 -42 L 48 -44 L 54 -46 Z"
      fill="#FFD966"/>
  </g>

  <!-- Wordmark "Melody" -->
  <g transform="translate(240 270)" text-anchor="middle">
    <text x="0" y="0"
      font-family="-apple-system, 'SF Pro Rounded', 'SF Pro', 'Segoe UI', system-ui, sans-serif"
      font-weight="700"
      font-size="64"
      letter-spacing="2"
      fill="#3D2B3D">Melody</text>
    <!-- Underline flourish: tiny heart dot -->
    <path d="M 0 26
      C -3 21, -10 21, -10 27
      C -10 32, -5 35, 0 38
      C 5 35, 10 32, 10 27
      C 10 21, 3 21, 0 26 Z"
      fill="#F48FB1"/>
  </g>
</svg>
