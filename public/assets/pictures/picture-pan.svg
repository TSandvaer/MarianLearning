<?xml version="1.0" encoding="UTF-8"?>
<!--
  picture-pan.svg
  Frying pan with single long handle for the CVC word "pan" in Word Song.
  Phase 3 trace of design/references/picture-pack/picture-pan.png.
  - viewBox 0 0 200 200
  - Outer contour #3E2818 2.2px
  - Palette: pan body soft-grey #C8C2BD / shadow #807468, interior
    cream #F5DCC9, handle dark warm-grey #807468 / shadow #5C5048.
  - Distinctness gate (per spec §1.8 pan AC, load-bearing):
    SHALLOW DISC + ONE LONG HANDLE projecting up-right — discriminator
    from pot (deep cylinder + 2 short side-handles).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pan">
  <title>Pan</title>

  <!-- Handle shadow (darker right side) -->
  <path d="M 102 88
           L 162 28
           L 168 34
           L 108 94 Z"
        fill="#5C5048"/>

  <!-- Handle (long cylinder, dark grey) -->
  <path d="M 96 84
           L 156 24
           Q 162 18, 168 24
           Q 174 30, 168 36
           L 108 96 Z"
        fill="#807468"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Hanging-loop hole at handle tip -->
  <ellipse cx="162" cy="30" rx="4" ry="3"
           fill="#3E2818"
           stroke="#3E2818"
           stroke-width="1"/>

  <!-- Handle attachment plate (small rivet area where handle meets pan) -->
  <path d="M 100 90
           L 116 90
           L 122 102
           L 96 102 Z"
        fill="#807468"
        stroke="#3E2818"
        stroke-width="2"
        stroke-linejoin="round"/>
  <circle cx="106" cy="96" r="1.5" fill="#3E2818"/>
  <circle cx="116" cy="96" r="1.5" fill="#3E2818"/>

  <!-- Pan body shadow (right-bottom companion under disc) -->
  <ellipse cx="92" cy="148" rx="68" ry="38"
           fill="#807468"/>

  <!-- Pan outer ring (rim) -->
  <ellipse cx="86" cy="138" rx="72" ry="40"
           fill="#C8C2BD"
           stroke="#3E2818"
           stroke-width="2.2"/>

  <!-- Pan interior (lighter cream cooking surface, slight inset) -->
  <ellipse cx="86" cy="134" rx="62" ry="34"
           fill="#F5DCC9"
           stroke="#3E2818"
           stroke-width="2"/>

  <!-- Inside-rim highlight curve (top of pan interior) -->
  <path d="M 32 122 Q 86 110, 144 124"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.7"/>

  <!-- Subtle interior shadow gradient (right side of inner bowl) -->
  <path d="M 110 122 Q 140 138, 130 168 Q 100 162, 90 154"
        fill="#E5C9B0"
        opacity="0.5"/>
</svg>
