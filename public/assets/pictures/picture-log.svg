<?xml version="1.0" encoding="UTF-8"?>
<!--
  picture-log.svg
  Wood log with end-grain rings for the CVC word "log" in Word Song
  (distractor-only / promoted-from-distractor entry).
  Phase 3 trace of design/references/picture-pack/picture-log.png.
  - viewBox 0 0 200 200
  - Outer contour #3E2818 2.2px
  - Palette: bark warm-brown #8B6749 / shadow #6B4A30, end-grain
    light-cream #F5DCC9 + ring #C8946C + ring centre #8B6749.
  - Distinctness gate (per spec §2.7 log AC, load-bearing):
    BARK TEXTURE + visible END-GRAIN RINGS at one cut end —
    discriminator from a generic brown stick.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Log">
  <title>Log</title>

  <!-- Log shadow companion (under-belly, soft) -->
  <ellipse cx="100" cy="156" rx="80" ry="10"
           fill="#6B4A30" opacity="0.35"/>

  <!-- Log body shadow (darker brown bottom half) -->
  <path d="M 50 110
           L 178 100
           Q 184 110, 184 130
           Q 184 144, 178 154
           L 50 158 Z"
        fill="#6B4A30"/>

  <!-- Log body (warm-brown bark cylinder, lying horizontal) -->
  <path d="M 50 96
           L 178 96
           Q 184 100, 184 130
           Q 184 154, 178 158
           L 50 158
           Q 38 154, 38 130
           Q 38 100, 50 96 Z"
        fill="#8B6749"
        stroke="#3E2818"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Bark texture (vertical short lines along body) -->
  <g stroke="#3E2818" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <line x1="62" y1="106" x2="62" y2="148"/>
    <line x1="76" y1="104" x2="76" y2="150"/>
    <line x1="90" y1="106" x2="90" y2="148"/>
    <line x1="104" y1="104" x2="104" y2="150"/>
    <line x1="118" y1="106" x2="118" y2="148"/>
    <line x1="132" y1="104" x2="132" y2="150"/>
    <line x1="146" y1="106" x2="146" y2="148"/>
    <line x1="160" y1="108" x2="160" y2="146"/>
  </g>

  <!-- Bark surface highlights (top edge, lighter ridge) -->
  <path d="M 50 102 Q 100 96, 178 102"
        fill="none"
        stroke="#A88060"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.7"/>

  <!-- ===== END-GRAIN RINGS (left cut end — load-bearing detail) ===== -->

  <!-- End-grain shadow companion -->
  <ellipse cx="42" cy="130" rx="14" ry="34"
           fill="#C8946C"/>
  <!-- End-grain face (light cream) -->
  <ellipse cx="38" cy="128" rx="14" ry="34"
           fill="#F5DCC9"
           stroke="#3E2818"
           stroke-width="2.5"/>

  <!-- Concentric tree-rings (three rings + centre) -->
  <ellipse cx="38" cy="128" rx="11" ry="27"
           fill="none"
           stroke="#C8946C"
           stroke-width="1.5"/>
  <ellipse cx="38" cy="128" rx="8" ry="20"
           fill="none"
           stroke="#A88060"
           stroke-width="1.2"/>
  <ellipse cx="38" cy="128" rx="5" ry="13"
           fill="none"
           stroke="#8B6749"
           stroke-width="1.2"/>
  <!-- Centre core ring -->
  <ellipse cx="38" cy="128" rx="2" ry="5"
           fill="#8B6749"
           stroke="#3E2818"
           stroke-width="1"/>

  <!-- Radial crack from centre (single small crack) -->
  <line x1="38" y1="128" x2="38" y2="100"
        stroke="#3E2818" stroke-width="1" opacity="0.5"/>
</svg>
