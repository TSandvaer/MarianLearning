<?xml version="1.0" encoding="UTF-8"?>
<!--
  picture-pot.svg
  Cooking pot with two side handles for the CVC word "pot" in Word Song.
  Phase 3 trace of design/references/picture-pack/picture-pot.png.
  - viewBox 0 0 200 200
  - Outer contour #3E2818 2.2px
  - Palette: pot body soft-grey #C8C2BD / shadow #807468, lid same family,
    knob warm-brown #8B6749, handles warm-brown #8B6749 / shadow #6B4A30.
  - Distinctness gates (per spec §2.8 pot AC, load-bearing):
    1. TALL CYLINDER + 2 SIDE-HANDLES — discriminator from pan
       (shallow disc + 1 long handle).
    2. NO STEAM and 2 HANDLES — discriminator from hot
       (shallow wide bowl + 3 steam curls + no handles).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pot">
  <title>Pot</title>

  <!-- Left handle shadow -->
  <path d="M 38 92 Q 22 92, 18 102 Q 18 110, 28 110 Q 26 100, 38 100 Z"
        fill="#6B4A30"/>
  <!-- Left handle (warm-brown wood/bakelite knob — circular loop) -->
  <path d="M 36 88 Q 18 88, 14 102 Q 14 116, 30 116 Q 28 104, 36 102"
        fill="#8B6749"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"
        fill-rule="evenodd"/>

  <!-- Right handle shadow -->
  <path d="M 162 92 Q 178 92, 182 102 Q 182 110, 172 110 Q 174 100, 162 100 Z"
        fill="#6B4A30"/>
  <!-- Right handle (mirror of left) -->
  <path d="M 164 88 Q 182 88, 186 102 Q 186 116, 170 116 Q 172 104, 164 102"
        fill="#8B6749"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"
        fill-rule="evenodd"/>

  <!-- Pot body shadow (right side, cel-companion) -->
  <path d="M 102 92
           L 158 92
           L 158 174
           Q 158 180, 152 180
           L 102 180 Z"
        fill="#807468"/>

  <!-- Pot body (deep cylinder, soft-grey) -->
  <path d="M 42 92
           L 158 92
           L 158 174
           Q 158 180, 152 180
           L 48 180
           Q 42 180, 42 174 Z"
        fill="#C8C2BD"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Highlight stripe on left side -->
  <line x1="52" y1="106" x2="52" y2="172"
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Pot rim ellipse (where lid sits) -->
  <ellipse cx="100" cy="92" rx="58" ry="8"
           fill="#807468"
           stroke="#3E2818"
           stroke-width="2.2"/>

  <!-- Lid shadow -->
  <ellipse cx="104" cy="78" rx="56" ry="8"
           fill="#807468"/>
  <!-- Lid body (sits atop pot, dome shape) -->
  <path d="M 42 80
           Q 50 64, 100 60
           Q 150 64, 158 80
           Q 100 90, 42 80 Z"
        fill="#C8C2BD"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Lid knob (warm brown center) -->
  <ellipse cx="100" cy="58" rx="8" ry="4"
           fill="#8B6749"
           stroke="#3E2818"
           stroke-width="2"/>
  <ellipse cx="100" cy="56" rx="6" ry="2"
           fill="#A88060"/>

  <!-- Subtle metallic shading band on body -->
  <path d="M 100 130 Q 130 128, 150 130"
        fill="none"
        stroke="#807468"
        stroke-width="1.2"
        stroke-linecap="round"
        opacity="0.5"/>
</svg>
