<?xml version="1.0" encoding="UTF-8"?>
<!--
  picture-sun.svg
  Sun with radiating rays for the CVC word "sun" in Word Song
  (distractor-only entry).
  Phase 3 trace of design/references/picture-pack/picture-sun.png.
  - viewBox 0 0 200 200
  - Outer contour #3E2818 2.2px
  - Palette: disc warm-yellow #F4D89B / shadow #E5BC74, ray rose-tint
    #F0CDB8 / shadow #D9A079.
  - Distinctness gate (per spec §2.2 sun AC, load-bearing):
    NO FACE / NO EYES / NO SMILE — pack-wide rule. Round disc + simple
    radiating triangular rays only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sun">
  <title>Sun</title>

  <!-- 12 radiating triangular rays — alternating long/short for variety -->
  <g fill="#F0CDB8" stroke="#3E2818" stroke-width="1.5" stroke-linejoin="round">
    <!-- 12 rays at 30° intervals -->
    <polygon points="100,18 96,52 104,52"/>
    <polygon points="141,29 134,60 124,52"/>
    <polygon points="171,59 152,72 148,62"/>
    <polygon points="182,100 152,104 152,96"/>
    <polygon points="171,141 152,128 148,138"/>
    <polygon points="141,171 134,140 124,148"/>
    <polygon points="100,182 96,148 104,148"/>
    <polygon points="59,171 66,140 76,148"/>
    <polygon points="29,141 48,128 52,138"/>
    <polygon points="18,100 48,96 48,104"/>
    <polygon points="29,59 48,72 52,62"/>
    <polygon points="59,29 66,60 76,52"/>
  </g>

  <!-- Ray shadow companions (subtle one-side darker tone) -->
  <g fill="#D9A079" opacity="0.5">
    <polygon points="100,18 100,52 104,52"/>
    <polygon points="141,29 134,60 138,56"/>
    <polygon points="171,59 152,72 158,68"/>
    <polygon points="182,100 152,104 158,100"/>
    <polygon points="171,141 152,138 156,134"/>
    <polygon points="141,171 138,148 134,142"/>
    <polygon points="100,182 104,148 100,148"/>
    <polygon points="59,171 66,148 62,144"/>
    <polygon points="29,141 48,138 44,134"/>
    <polygon points="18,100 48,100 42,100"/>
    <polygon points="29,59 48,68 44,72"/>
    <polygon points="59,29 66,52 62,56"/>
  </g>

  <!-- Sun disc shadow companion (right side, cel-companion) -->
  <circle cx="104" cy="104" r="40"
          fill="#E5BC74"/>
  <!-- Sun disc (warm yellow, the centerpiece) -->
  <circle cx="100" cy="100" r="40"
          fill="#F4D89B"
          stroke="#3E2818"
          stroke-width="2.2"/>

  <!-- Inner highlight ring (very soft, suggests roundness — NOT a face) -->
  <circle cx="100" cy="100" r="34"
          fill="none"
          stroke="#FFE0A8"
          stroke-width="3"
          opacity="0.6"/>
  <circle cx="100" cy="100" r="24"
          fill="none"
          stroke="#F4D89B"
          stroke-width="2"
          opacity="0.5"/>

  <!-- Top-left highlight crescent (light catches the disc) -->
  <path d="M 78 80 Q 88 72, 102 72"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.6"/>
</svg>
