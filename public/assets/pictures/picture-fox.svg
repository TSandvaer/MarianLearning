<?xml version="1.0" encoding="UTF-8"?>
<!--
  picture-fox.svg
  Cartoon fox for the CVC word "fox" in Word Song
  (distractor-only / promoted-from-distractor entry).
  Phase 3 trace of design/references/picture-pack/picture-fox.png.
  - viewBox 0 0 200 200
  - Outer contour #3E2818 2.5px (animal budget per spec §6)
  - Palette: DESATURATED TERRACOTTA #D4886A coat (NOT photographic
    fox-orange, NOT neon — per spec §1.2 + AC10), darker shadow
    #B16650, white-cream chest #F5DCC9, ear-tip & paw-tip dark
    #3E2818, eye highlight cream #FCEEE2.
  - Distinctness gates (per spec §2.4 + AC10 fox AC, load-bearing):
    1. POINTED EARS (with dark tips).
    2. BUSHY TAIL with WHITE-CREAM TIP — the defining feature.
    3. CREAM CHEST/BELLY — visual anchor for "fox".
    4. Color is DESATURATED TERRACOTTA #D4886A — explicitly NOT
       photographic-orange or fire-orange.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Fox">
  <title>Fox</title>

  <!-- BUSHY TAIL (the defining feature, fluffy with cream tip) -->
  <!-- Tail orange body -->
  <path d="M 144 138
           Q 178 134, 178 160
           Q 174 178, 156 178
           Q 144 174, 144 138 Z"
        fill="#D4886A"
        stroke="#3E2818"
        stroke-width="2.5"
        stroke-linejoin="round"/>
  <!-- Tail shadow (under-side, darker) -->
  <path d="M 156 156 Q 174 158, 174 170 Q 162 178, 152 174 Z"
        fill="#B16650"/>
  <!-- Tail cream tip (load-bearing distinguishing detail) -->
  <ellipse cx="172" cy="154" rx="9" ry="7"
           fill="#F5DCC9"
           stroke="#3E2818"
           stroke-width="2"/>

  <!-- Body shadow companion (right side) -->
  <path d="M 100 116
           Q 130 116, 144 138
           Q 148 168, 138 184
           Q 122 188, 100 188 Z"
        fill="#B16650"/>

  <!-- Body (sitting, terracotta) -->
  <path d="M 60 116
           Q 70 110, 100 110
           Q 130 110, 142 124
           Q 148 156, 142 178
           Q 122 188, 100 188
           Q 78 188, 60 178
           Q 54 152, 60 124 Z"
        fill="#D4886A"
        stroke="#3E2818"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Cream chest/belly (front, blends from chest down) -->
  <path d="M 84 128
           Q 100 124, 116 128
           Q 118 168, 110 184
           Q 100 188, 90 184
           Q 82 168, 84 128 Z"
        fill="#F5DCC9"
        stroke="#3E2818"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Front paws (with dark socks per fox style) -->
  <ellipse cx="80" cy="184" rx="9" ry="6"
           fill="#3E2818"
           stroke="#3E2818"
           stroke-width="1.5"/>
  <ellipse cx="120" cy="184" rx="9" ry="6"
           fill="#3E2818"
           stroke="#3E2818"
           stroke-width="1.5"/>
  <!-- Above paws — short dark socks rising into orange body -->
  <path d="M 72 168 L 72 180 L 88 180 L 88 168 Z" fill="#3E2818" opacity="0.85"/>
  <path d="M 112 168 L 112 180 L 128 180 L 128 168 Z" fill="#3E2818" opacity="0.85"/>

  <!-- ===== HEAD ===== -->

  <!-- POINTED EARS (LEFT — triangular up) -->
  <path d="M 70 50 L 60 18 L 84 36 Z"
        fill="#D4886A"
        stroke="#3E2818"
        stroke-width="2.5"
        stroke-linejoin="round"/>
  <!-- Dark ear tip (left) -->
  <path d="M 64 34 L 60 18 L 72 26 Z"
        fill="#3E2818"
        stroke="#3E2818"
        stroke-width="1.2"
        stroke-linejoin="round"/>
  <!-- Inner ear (left, cream) -->
  <path d="M 72 38 L 70 28 L 78 36 Z"
        fill="#F5DCC9"
        opacity="0.85"/>

  <!-- POINTED EARS (RIGHT) -->
  <path d="M 130 50 L 140 18 L 116 36 Z"
        fill="#D4886A"
        stroke="#3E2818"
        stroke-width="2.5"
        stroke-linejoin="round"/>
  <!-- Dark ear tip (right) -->
  <path d="M 136 34 L 140 18 L 128 26 Z"
        fill="#3E2818"
        stroke="#3E2818"
        stroke-width="1.2"
        stroke-linejoin="round"/>
  <!-- Inner ear (right, cream) -->
  <path d="M 128 38 L 130 28 L 122 36 Z"
        fill="#F5DCC9"
        opacity="0.85"/>

  <!-- Head shadow companion -->
  <path d="M 106 36 Q 138 44, 138 80 Q 134 100, 110 110 Z"
        fill="#B16650"/>

  <!-- Head body (rounded fox face, slightly heart-shaped) -->
  <path d="M 70 56
           Q 78 38, 100 38
           Q 122 38, 130 56
           Q 138 78, 130 96
           Q 116 110, 100 110
           Q 84 110, 70 96
           Q 62 78, 70 56 Z"
        fill="#D4886A"
        stroke="#3E2818"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Cream face mask (the white facial markings of a fox) -->
  <path d="M 84 70
           Q 100 64, 116 70
           Q 120 86, 110 102
           Q 100 108, 90 102
           Q 80 86, 84 70 Z"
        fill="#F5DCC9"
        stroke="#3E2818"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Eyes (almond shape, friendly) -->
  <ellipse cx="86" cy="76" rx="4" ry="5"
           fill="#3E2818"/>
  <ellipse cx="114" cy="76" rx="4" ry="5"
           fill="#3E2818"/>
  <!-- Eye highlights -->
  <circle cx="87" cy="74" r="1" fill="#FFFFFF"/>
  <circle cx="115" cy="74" r="1" fill="#FFFFFF"/>

  <!-- Tiny dark nose -->
  <ellipse cx="100" cy="92" rx="3" ry="2.2"
           fill="#3E2818"/>

  <!-- Mouth (small smile lines) -->
  <path d="M 100 94 L 100 100 Q 96 102, 92 100"
        fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 100 100 Q 104 102, 108 100"
        fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round"/>
</svg>
