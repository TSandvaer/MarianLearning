<?xml version="1.0" encoding="UTF-8"?>
<!--
  picture-cap.svg
  Baseball cap for the CVC word "cap" in Word Song.
  Phase 3 trace of design/references/picture-pack/picture-cap.png.
  - viewBox 0 0 200 200
  - Outer contour #3E2818 2.2px
  - Palette: crown soft-rose #FFB7C5 / shadow #E89AAA, peak (visor)
    same family with darker underside.
  - Distinctness gate (per spec §1.9 cap AC, load-bearing):
    FORWARD PEAK only (no all-around brim) — discriminator from hat.
    The peak projects to the right; rounded crown + button on top.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cap">
  <title>Cap</title>

  <!-- Crown shadow (right side, cel-companion under panel seams) -->
  <path d="M 100 50
           Q 144 50, 152 122
           L 100 122 Z"
        fill="#E89AAA"/>

  <!-- Crown body (rounded baseball-cap dome) -->
  <path d="M 48 122
           Q 48 50, 100 50
           Q 144 50, 152 122 Z"
        fill="#FFB7C5"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Stitched panel seams (light contour, suggesting baseball-cap panels) -->
  <path d="M 100 50 L 100 122"
        stroke="#C77A7A" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 76 56 Q 84 90, 84 122"
        stroke="#C77A7A" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 124 56 Q 116 90, 116 122"
        stroke="#C77A7A" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Button on top of crown -->
  <circle cx="100" cy="52" r="3.5"
          fill="#C77A7A"
          stroke="#3E2818"
          stroke-width="1.5"/>

  <!-- Peak / visor shadow (under-side, darker) -->
  <path d="M 100 122
           Q 154 124, 178 138
           Q 178 144, 156 144
           Q 130 144, 100 138 Z"
        fill="#C77A7A"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"/>
  <!-- Peak / visor top face (lit) -->
  <path d="M 100 122
           Q 154 122, 178 136
           Q 162 134, 144 134
           Q 122 134, 100 130 Z"
        fill="#FFB7C5"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Front headband line (where crown meets visor) -->
  <path d="M 48 122 Q 100 130, 152 122"
        fill="none"
        stroke="#3E2818"
        stroke-width="1.8"
        stroke-linecap="round"/>
</svg>
