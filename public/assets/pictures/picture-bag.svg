<?xml version="1.0" encoding="UTF-8"?>
<!--
  picture-bag.svg
  Soft fabric tote bag for the CVC word "bag" in Word Song.
  Phase 3 trace of design/references/picture-pack/picture-bag.png.
  - viewBox 0 0 200 200
  - Outer contour #3E2818 2.2px
  - Palette: bag body soft-rose #FFB7C5 / shadow #E89AAA, handle #FFB7C5
    with darker stroke. Cinched gathers indicated with simple curves.
  - Distinctness gate (per spec §1.5 bag AC, load-bearing):
    BODY-WITH-ARCHING-HANDLE silhouette — discriminator from tag (small
    flat card-with-string). Slouchy fabric folds suggested by curved
    side seams.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bag">
  <title>Bag</title>

  <!-- Handle shadow companion -->
  <path d="M 78 84
           Q 78 38, 100 38
           Q 122 38, 122 84"
        fill="none"
        stroke="#E89AAA"
        stroke-width="14"
        stroke-linecap="round"/>
  <!-- Handle (single arching strap) -->
  <path d="M 78 84
           Q 78 42, 100 42
           Q 122 42, 122 84"
        fill="none"
        stroke="#FFB7C5"
        stroke-width="10"
        stroke-linecap="round"/>
  <path d="M 78 84
           Q 78 42, 100 42
           Q 122 42, 122 84"
        fill="none"
        stroke="#3E2818"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Bag body shadow (right side, cel-companion) -->
  <path d="M 100 78
           Q 138 80, 158 100
           Q 168 124, 158 152
           Q 144 174, 110 178
           Q 100 180, 100 178 Z"
        fill="#E89AAA"/>

  <!-- Bag body (slouchy tote with cinched top — soft rose) -->
  <path d="M 70 78
           Q 60 78, 50 88
           Q 36 104, 38 130
           Q 42 158, 70 174
           Q 100 180, 130 174
           Q 158 158, 162 130
           Q 164 104, 150 88
           Q 140 78, 130 78
           Q 124 86, 100 86
           Q 76 86, 70 78 Z"
        fill="#FFB7C5"
        stroke="#3E2818"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Cinched gather marks at top of bag -->
  <path d="M 78 80 Q 80 86, 78 92" fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 90 82 Q 92 88, 90 94" fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 110 82 Q 108 88, 110 94" fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 122 80 Q 120 86, 122 92" fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Soft fabric folds (vertical curves on body) -->
  <path d="M 60 100 Q 56 130, 64 168" fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 84 96 Q 80 130, 86 174" fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 116 96 Q 120 130, 114 174" fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 140 100 Q 144 130, 136 168" fill="none" stroke="#3E2818" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
