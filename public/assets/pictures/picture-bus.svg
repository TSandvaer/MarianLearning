<?xml version="1.0" encoding="UTF-8"?>
<!--
  picture-bus.svg
  Long school bus for the CVC word "bus" in Word Song
  (distractor-only entry).
  Phase 3 trace of design/references/picture-pack/picture-bus.png.
  - viewBox 0 0 200 200
  - Outer contour #3E2818 2.2px
  - Palette: body DESATURATED warm-cream-yellow #F4D89B / shadow
    #E5BC74 (NOT saturated school-bus yellow per spec §2.1),
    windows soft-blue #C5DFE8 / shadow #A5C4D8, wheels #3E2818 +
    hub #807468, accent stripe warm-brown #8B6749.
  - Distinctness gates (per spec §2.1 + AC10 bus AC, load-bearing):
    1. 3+ WINDOWS along the side — discriminator from van
       (2 windows).
    2. LONG vehicle proportions — discriminator from van.
    3. DESATURATED YELLOW — explicitly NOT saturated school-bus
       yellow.
    4. NO smiley face — pure object render.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bus">
  <title>Bus</title>

  <!-- Body ground shadow -->
  <ellipse cx="100" cy="160" rx="92" ry="6"
           fill="#3E2818" opacity="0.25"/>

  <!-- Body shadow (right side cel-companion) -->
  <path d="M 100 80 L 188 80 L 190 116 L 188 150 L 100 150 Z"
        fill="#E5BC74"/>

  <!-- Bus body (long rectangular, full-width) -->
  <path d="M 12 110
           Q 12 86, 22 84
           L 178 84
           Q 188 84, 190 96
           L 192 110
           L 192 144
           Q 192 150, 184 150
           L 16 150
           Q 8 150, 8 144 Z"
        fill="#F4D89B"
        stroke="#3E2818"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- ===== 4 WINDOWS along the side (load-bearing 3+) ===== -->

  <!-- Window 1 -->
  <rect x="20" y="92" width="32" height="18"
        rx="2"
        fill="#C5DFE8"
        stroke="#3E2818"
        stroke-width="2"/>
  <path d="M 42 94 L 52 104 L 52 108 L 46 108 Z" fill="#A5C4D8"/>

  <!-- Window 2 -->
  <rect x="58" y="92" width="32" height="18"
        rx="2"
        fill="#C5DFE8"
        stroke="#3E2818"
        stroke-width="2"/>
  <path d="M 80 94 L 90 104 L 90 108 L 84 108 Z" fill="#A5C4D8"/>

  <!-- Window 3 -->
  <rect x="96" y="92" width="32" height="18"
        rx="2"
        fill="#C5DFE8"
        stroke="#3E2818"
        stroke-width="2"/>
  <path d="M 118 94 L 128 104 L 128 108 L 122 108 Z" fill="#A5C4D8"/>

  <!-- Window 4 (cab, front of bus) -->
  <path d="M 134 92
           L 178 92
           Q 184 94, 184 104
           L 184 110
           L 134 110 Z"
        fill="#C5DFE8"
        stroke="#3E2818"
        stroke-width="2"/>
  <path d="M 168 94 L 184 104 L 184 110 L 174 110 Z" fill="#A5C4D8"/>

  <!-- Window highlight strips (top edges) -->
  <line x1="22" y1="96" x2="50" y2="96" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="96" x2="88" y2="96" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <line x1="98" y1="96" x2="126" y2="96" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <line x1="138" y1="96" x2="178" y2="96" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>

  <!-- Decorative stripe (warm-brown stripe along middle) -->
  <rect x="8" y="120" width="184" height="6"
        fill="#8B6749"
        opacity="0.85"/>
  <line x1="8" y1="120" x2="192" y2="120" stroke="#3E2818" stroke-width="1.2"/>
  <line x1="8" y1="126" x2="192" y2="126" stroke="#3E2818" stroke-width="1.2"/>

  <!-- Door (rear, on left side of bus, vertical seam) -->
  <line x1="14" y1="110" x2="14" y2="150" stroke="#3E2818" stroke-width="2"/>
  <line x1="32" y1="110" x2="32" y2="150" stroke="#3E2818" stroke-width="1.5"/>

  <!-- Front headlight (small circle near front) -->
  <circle cx="184" cy="138" r="3"
          fill="#FFE0A8"
          stroke="#3E2818"
          stroke-width="1.5"/>

  <!-- Wheels (left + right, slightly inset) -->
  <circle cx="42" cy="156" r="14"
          fill="#3E2818"
          stroke="#3E2818"
          stroke-width="2"/>
  <circle cx="42" cy="156" r="6"
          fill="#807468"
          stroke="#3E2818"
          stroke-width="1.5"/>
  <circle cx="42" cy="156" r="2"
          fill="#3E2818"/>
  <!-- Spokes on hub -->
  <line x1="42" y1="150" x2="42" y2="162" stroke="#3E2818" stroke-width="1"/>
  <line x1="36" y1="156" x2="48" y2="156" stroke="#3E2818" stroke-width="1"/>

  <circle cx="158" cy="156" r="14"
          fill="#3E2818"
          stroke="#3E2818"
          stroke-width="2"/>
  <circle cx="158" cy="156" r="6"
          fill="#807468"
          stroke="#3E2818"
          stroke-width="1.5"/>
  <circle cx="158" cy="156" r="2"
          fill="#3E2818"/>
  <line x1="158" y1="150" x2="158" y2="162" stroke="#3E2818" stroke-width="1"/>
  <line x1="152" y1="156" x2="164" y2="156" stroke="#3E2818" stroke-width="1"/>

  <!-- Wheel arch lines on body -->
  <path d="M 26 150 Q 42 138, 58 150" fill="none" stroke="#3E2818" stroke-width="1.5"/>
  <path d="M 142 150 Q 158 138, 174 150" fill="none" stroke="#3E2818" stroke-width="1.5"/>
</svg>
